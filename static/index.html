<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Natural Voice Reader</title>
<style>
  :root {
    --bg: #ffffff; --panel: #ffffff; --ink: #1a1a1c; --muted: #8a8a8f;
    --accent: #e0662a; --hl: #ffe08a; --hl-ink: #402c00; --line: #ececef;
    --chip: #f4f4f6; --sheet: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11; --panel: #17171a; --ink: #f1f1f3; --muted: #8e8e94;
      --accent: #f0783c; --hl: #5a4413; --hl-ink: #ffe9b3; --line: #2a2a2e;
      --chip: #242428; --sheet: #1b1b1f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, system-ui, sans-serif; line-height: 1.6; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 12px 16px;
           padding-top: max(12px, env(safe-area-inset-top)); }
  .bar { display: flex; gap: 8px; align-items: center;
         max-width: 780px; margin: 0 auto; }
  .bar-between { justify-content: space-between; }
  .app-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .spacer { flex: 1; }
  input[type=url] {
    width: 100%; padding: 13px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 16px; }
  button { font-family: inherit; cursor: pointer; border: 1px solid var(--line);
           background: var(--bg); color: var(--ink); border-radius: 11px;
           padding: 11px 16px; font-size: 15px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent);
                   font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .icon { width: 44px; padding: 0; height: 44px; font-size: 19px; flex: none;
          display: flex; align-items: center; justify-content: center; }
  main { max-width: 720px; margin: 0 auto; padding: 26px 20px 170px; }

  /* List view */
  #list { max-width: 720px; margin: 0 auto; }
  .card { display: flex; align-items: stretch; border: 1px solid var(--line);
          border-radius: 14px; margin-bottom: 12px; background: var(--panel); overflow: hidden; }
  .card-main { flex: 1; padding: 15px 16px; cursor: pointer; min-width: 0; }
  .card-title { font-size: 17px; font-weight: 650; line-height: 1.3; margin-bottom: 5px;
                overflow-wrap: anywhere; }
  .card-meta { font-size: 13px; color: var(--muted); }
  .card .del { border: none; background: none; color: var(--muted); font-size: 24px;
               width: 46px; flex: none; }
  #listStatus { color: var(--muted); text-align: center; padding: 44px 20px; font-size: 15px; }
  #listStatus.err { color: #d0402a; }

  /* Reader view */
  #back { font-size: 28px; line-height: 1; }
  #title { font-family: -apple-system, system-ui, sans-serif; font-size: 27px;
           font-weight: 800; line-height: 1.22; margin: 0 0 22px; letter-spacing: -.01em; }
  #article { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; line-height: 1.78; }
  #article p { margin: 0 0 1.15em; }
  .w { border-radius: 5px; cursor: pointer; transition: background .08s; }
  .w.active, .w.flash { background: var(--hl); color: var(--hl-ink);
              box-shadow: 0 0 0 3px var(--hl); }

  /* Compass: appears when the narrated word is scrolled out of view */
  .compass { position: fixed; right: 16px; z-index: 15;
             bottom: calc(104px + env(safe-area-inset-bottom));
             width: 46px; height: 46px; border-radius: 50%; border: none;
             background: var(--accent); color: #fff; font-size: 20px; cursor: pointer;
             box-shadow: 0 4px 14px rgba(0,0,0,.28); display: none;
             align-items: center; justify-content: center; }
  .compass.show { display: flex; }
  #status { color: var(--muted); font-size: 15px; padding: 40px 0; text-align: center; }
  #status.err { color: #d0402a; }

  .player { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
            border-top: 1px solid var(--line); padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom)); display: none;
            box-shadow: 0 -6px 22px rgba(0,0,0,.07); }
  .player.on { display: block; }
  .player .inner { max-width: 780px; margin: 0 auto; width: 100%;
                   display: flex; align-items: center; gap: 12px; }
  #play { width: 52px; height: 52px; border-radius: 50%; font-size: 19px; flex: none;
          display: flex; align-items: center; justify-content: center; }
  #seek { flex: 1; accent-color: var(--accent); height: 26px; }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px;
          flex: none; min-width: 82px; text-align: right; white-space: nowrap; }
  #speedChip { flex: none; background: var(--chip); border-color: transparent;
               padding: 9px 13px; font-size: 14px; font-weight: 600;
               font-variant-numeric: tabular-nums; }
  #note { max-width: 780px; margin: 7px auto 0; text-align: center; color: var(--muted);
          font-size: 12px; min-height: 15px; }

  /* Bottom sheets */
  .sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
             opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheetbg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
           background: var(--sheet); border-radius: 20px 20px 0 0;
           padding: 8px 20px max(20px, env(safe-area-inset-bottom));
           transform: translateY(110%); transition: transform .25s ease;
           box-shadow: 0 -10px 40px rgba(0,0,0,.2); max-width: 520px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line);
          margin: 8px auto 16px; }
  .field { margin: 0 0 20px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--muted);
                 text-transform: uppercase; letter-spacing: .04em; margin-bottom: 9px; }
  #voice { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 12px;
           background: var(--bg); color: var(--ink); font-size: 16px; }
  .speeds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .speeds button { font-variant-numeric: tabular-nums; padding: 13px 0; font-size: 15px; }
  .speeds button.sel { background: var(--accent); color: #fff; border-color: var(--accent);
                       font-weight: 700; }
  .add-err { color: #d0402a; font-size: 14px; min-height: 18px; margin: 2px 0 10px; }
  #addSubmit, #sheetDone { width: 100%; margin-top: 4px; padding: 14px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between;
                gap: 12px; font-size: 16px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: var(--line); border-radius: 999px;
                   transition: background .2s; cursor: pointer; }
  .switch .track::before { content: ''; position: absolute; left: 3px; top: 3px;
                           width: 22px; height: 22px; background: #fff; border-radius: 50%;
                           transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(20px); }
  .hidden { display: none; }
</style>
</head>
<body>

<!-- ===== LIST VIEW ===== -->
<div id="listView">
  <header>
    <div class="bar bar-between">
      <h1 class="app-title">Reading List</h1>
      <button id="addBtn" class="primary">+ Add article</button>
    </div>
  </header>
  <main>
    <div id="list"></div>
    <div id="listStatus"></div>
  </main>
</div>

<!-- ===== READER VIEW ===== -->
<div id="readerView" class="hidden">
  <header>
    <div class="bar">
      <button id="back" class="icon" aria-label="Back to list">‹</button>
      <div class="spacer"></div>
      <button id="gear" class="icon" aria-label="Settings">⚙</button>
    </div>
  </header>
  <main>
    <h1 id="title" class="hidden"></h1>
    <div id="status"></div>
    <div id="article"></div>
  </main>
  <div class="player" id="player">
    <div class="inner">
      <button id="play" class="primary">▶</button>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="time">0:00</span>
      <button id="speedChip">1.25×</button>
    </div>
    <div id="note"></div>
  </div>
  <button class="compass" id="compass" aria-label="Scroll to the word being read">↓</button>
</div>

<audio id="audio"></audio>

<!-- ===== SHEETS (shared overlay) ===== -->
<div class="sheetbg" id="sheetBg"></div>

<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <div class="field">
    <div class="field-label">Article URL</div>
    <input id="addUrl" type="url" placeholder="https://…"
           autocomplete="off" autocapitalize="off" autocorrect="off">
  </div>
  <div id="addErr" class="add-err"></div>
  <button id="addSubmit" class="primary">Add to list</button>
</div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="field">
    <div class="field-label">Voice</div>
    <select id="voice"></select>
  </div>
  <div class="field">
    <div class="field-label">Speed</div>
    <div class="speeds" id="speeds"></div>
  </div>
  <div class="field">
    <div class="field-label">Reading guide</div>
    <div class="switch-row">
      <span>Highlight the word being read</span>
      <label class="switch"><input type="checkbox" id="hlToggle"><span class="track"></span></label>
    </div>
  </div>
  <button id="sheetDone" class="primary">Done</button>
</div>

<script>
const $ = s => document.querySelector(s);
const audio = $('#audio');

let TEXT = '';
let CHUNKS = [];
let spans = [];
let markIndex = [];       // {time, span} for the playing chunk
let playing = -1;
let active = -1;
let voice = 'en-US-AndrewMultilingualNeural';
let genId = 0;
let totalWords = 0;       // article word count, for ETA
let CUR_ID = null;        // id of the open article, for resume
let dragging = false;     // user is scrubbing the progress bar
let lastSave = 0;         // throttle for resume-position saves
let highlightOn = localStorage.getItem('nvr_highlight') !== 'off';  // reading-guide highlight
const WPM_1X = 180;       // measured pace of the default voice (Andrew) at 1x
const SPEEDS = [1.0, 1.1, 1.2, 1.25, 1.35, 1.5];  // finer steps, capped at 1.5x
// default 1.25x, but remember the user's last-used speed across sessions
let RATE = (() => { const v = parseFloat(localStorage.getItem('nvr_rate')); return SPEEDS.includes(v) ? v : 1.25; })();

const escapeHtml = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const plain = s => escapeHtml(s).replace(/\n{2,}/g, '</p><p>').replace(/\n/g, ' ');

// Runs a slow server task via the job API: POST starts it and returns a job id
// instantly, then we poll /api/job/{id} until it's done. This keeps every request
// under ~1s so Cloudflare's edge (which resets slower HTTP/2 requests) never trips.
async function runJob(url, body) {
  const start = await fetch(url, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  const s = await start.json();
  if (!start.ok) throw new Error(s.detail || start.statusText);
  const job = s.job;
  for (let tries = 0; tries < 240; tries++) {   // ~2 min ceiling
    await new Promise(r => setTimeout(r, 500));
    const r = await fetch('/api/job/' + job);
    if (!r.ok) throw new Error('Lost track of the job — try again.');
    const j = await r.json();
    if (j.status === 'done') return j.result;
    if (j.status === 'error') throw new Error(j.error);
  }
  throw new Error('Timed out.');
}

// --- View switching ---
function showView(v) {
  $('#listView').classList.toggle('hidden', v !== 'list');
  $('#readerView').classList.toggle('hidden', v !== 'reader');
}

// --- Voices + speed presets ---
fetch('/api/voices').then(r => r.json()).then(vs => {
  $('#voice').innerHTML = vs.map(v => `<option value="${v.id}">${v.label}</option>`).join('');
  voice = vs[0].id;
});
$('#voice').addEventListener('change', e => { voice = e.target.value; });

$('#speeds').innerHTML = SPEEDS.map(s =>
  `<button data-s="${s}"${s === RATE ? ' class="sel"' : ''}>${s}×</button>`).join('');
$('#speeds').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setRate(parseFloat(b.dataset.s));
});
function setRate(r) {
  RATE = r; audio.playbackRate = r;
  try { localStorage.setItem('nvr_rate', r); } catch (e) {}
  $('#speedChip').textContent = r + '×';
  $('#speeds').querySelectorAll('button').forEach(b =>
    b.classList.toggle('sel', parseFloat(b.dataset.s) === r));
  if (TEXT) updateTimeDisplay(articleFrac());   // ETA reflects the new speed at once
}
setRate(RATE);   // sync chip / selected preset / stored value on load
audio.addEventListener('loadedmetadata', () => { audio.playbackRate = RATE; });

// --- Whole-article progress + ETA (word-based, scales with speed) ---
function etaTotalSec() { return totalWords ? (totalWords / (WPM_1X * RATE)) * 60 : 0; }
function articleFrac() {           // fraction of the whole article read so far
  const c = CHUNKS[playing];
  if (!c || !audio.duration || !TEXT) return 0;
  const within = Math.min(1, audio.currentTime / audio.duration);
  return Math.min(1, (c.start + within * (c.end - c.start)) / TEXT.length);
}
function updateTimeDisplay(frac) {
  const total = etaTotalSec();
  $('#time').textContent = fmt(frac * total) + ' / ' + fmt(total);
}

// --- Bottom sheets ---
function openSheetEl(el) { el.classList.add('open'); $('#sheetBg').classList.add('open'); }
function closeSheets() {
  $('#sheet').classList.remove('open');
  $('#addSheet').classList.remove('open');
  $('#sheetBg').classList.remove('open');
}
$('#gear').onclick = () => openSheetEl($('#sheet'));
$('#speedChip').onclick = () => openSheetEl($('#sheet'));
$('#sheetBg').onclick = closeSheets;
$('#sheetDone').onclick = closeSheets;

// Reading-guide highlight toggle (persisted)
$('#hlToggle').checked = highlightOn;
$('#hlToggle').addEventListener('change', e => {
  highlightOn = e.target.checked;
  try { localStorage.setItem('nvr_highlight', highlightOn ? 'on' : 'off'); } catch (err) {}
  if (spans[active]) spans[active].classList.toggle('active', highlightOn);
});

// ============================================================
//  READING LIST
// ============================================================
async function loadList() {
  $('#listStatus').className = '';
  $('#listStatus').textContent = 'Loading…';
  try {
    const res = await fetch('/api/articles');
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    renderList(await res.json());
  } catch (e) {
    $('#list').innerHTML = '';
    $('#listStatus').className = 'err';
    $('#listStatus').textContent = 'Error: ' + e.message;
  }
}

function cardHtml(a) {
  const date = a.added_at
    ? new Date(a.added_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  const p = loadProgress(a.id);
  const read = p > 0.01 && p < 0.99 ? `${Math.round(p * 100)}% read` : '';
  const meta = [a.domain, date, a.est_minutes ? `~${a.est_minutes} min` : '', read]
    .filter(Boolean).join(' · ');
  return `<div class="card" data-id="${a.id}">
    <div class="card-main">
      <div class="card-title">${escapeHtml(a.title || a.url)}</div>
      <div class="card-meta">${escapeHtml(meta)}</div>
    </div>
    <button class="del" aria-label="Delete">×</button>
  </div>`;
}

function renderList(items) {
  if (!items.length) {
    $('#list').innerHTML = '';
    $('#listStatus').className = '';
    $('#listStatus').textContent = 'No saved articles yet. Tap “+ Add article” to save one.';
    return;
  }
  $('#listStatus').textContent = '';
  $('#list').innerHTML = items.map(cardHtml).join('');
  $('#list').querySelectorAll('.card').forEach(el => {
    const item = items.find(x => x.id === el.dataset.id);
    el.querySelector('.card-main').onclick = () => openArticle(item);
    el.querySelector('.del').onclick = () => deleteArticle(el.dataset.id, el);
  });
}

async function deleteArticle(id, el) {
  el.style.opacity = .4;
  try {
    const r = await fetch('/api/articles/' + id, { method: 'DELETE' });
    if (!r.ok) throw new Error((await r.json()).detail || 'Delete failed');
    el.remove();
    if (!$('#list').children.length) renderList([]);
  } catch (e) {
    el.style.opacity = 1;
    alert('Could not delete: ' + e.message);
  }
}

async function addArticle() {
  const url = $('#addUrl').value.trim();
  if (!url) return;
  $('#addSubmit').disabled = true;
  $('#addSubmit').textContent = 'Adding…';
  $('#addErr').textContent = '';
  try {
    await runJob('/api/articles', { url });
    closeSheets();
    await loadList();
  } catch (e) {
    $('#addErr').textContent = 'Error: ' + e.message;
  } finally {
    $('#addSubmit').disabled = false;
    $('#addSubmit').textContent = 'Add to list';
  }
}
$('#addBtn').onclick = () => { $('#addUrl').value = ''; $('#addErr').textContent = ''; openSheetEl($('#addSheet')); $('#addUrl').focus(); };
$('#addSubmit').onclick = addArticle;
$('#addUrl').addEventListener('keydown', e => { if (e.key === 'Enter') addArticle(); });

$('#back').onclick = () => {
  saveProgress();       // remember where we are for next time
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  genId++;              // cancel any in-flight synthesis
  playing = -1;
  $('#player').classList.remove('on');
  $('#compass').classList.remove('show');
  clearActive();
  loadList();           // refresh cards so the "% read" badge updates
  showView('list');
};

// ============================================================
//  ARTICLE READER  (unchanged playback engine)
// ============================================================
function renderArticle() {
  const all = [];
  CHUNKS.forEach(c => (c.marks || []).forEach(m => all.push(m)));
  all.sort((a, b) => a.start - b.start);
  const out = [];
  let cur = 0;
  all.forEach((m, i) => {
    if (m.start > cur) out.push(plain(TEXT.slice(cur, m.start)));
    out.push(`<span class="w" data-i="${i}">${escapeHtml(TEXT.slice(m.start, m.end))}</span>`);
    cur = m.end;
    m._span = i;
  });
  if (cur < TEXT.length) out.push(plain(TEXT.slice(cur)));
  $('#article').innerHTML = '<p>' + out.join('') + '</p>';
  spans = Array.from(document.querySelectorAll('.w'));
  spans.forEach((sp, i) => sp.onclick = () => seekToGlobalSpan(i));
  window._allMarks = all;
}

function fmt(t) {
  if (!isFinite(t)) t = 0;
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}

// --- Synthesis (dedup + prefetch) ---
async function ensureChunk(i) {
  const c = CHUNKS[i];
  if (!c || c.audioUrl) return c;
  if (c._promise) return c._promise;
  const mine = genId;
  c._promise = (async () => {
    const data = await runJob('/api/tts', { text: TEXT.slice(c.start, c.end), voice });
    if (mine !== genId) return c;
    c.audioUrl = data.audio_url;
    c.marks = data.marks.map(m => ({ start: m.start + c.start, end: m.end + c.start, time: m.time }));
    renderArticle();
    return c;
  })();
  return c._promise;
}
// Keep a lookahead of 2 chunks warming up so the next part is ready in time.
function prefetch(i) { for (let j = i; j <= i + 2; j++) ensureChunk(j).catch(() => {}); }

function bindChunk(c) {
  markIndex = (c.marks || []).map(m => ({ time: m.time, span: m._span }))
                             .sort((a, b) => a.time - b.time);
}

// Status line under the player: "Part 2 of 44 · <message>".
function updateNote(msg) {
  const total = CHUNKS.length;
  const part = total > 1 && playing >= 0 ? `Part ${playing + 1} of ${total}` : '';
  $('#note').textContent = [part, msg].filter(Boolean).join(' · ');
}

// Initial play / seek target (runs inside a user gesture, so await+play is fine).
async function playFrom(i, seekTime = 0) {
  if (i < 0 || i >= CHUNKS.length) return;
  const mine = genId;
  playing = i;
  updateNote('Loading audio…');
  prefetch(i);
  let c;
  try { c = await ensureChunk(i); }
  catch (e) { updateNote('Error: ' + e.message); return; }
  if (mine !== genId || playing !== i) return;
  bindChunk(c);
  audio.src = c.audioUrl;
  audio.playbackRate = RATE;
  try { await audio.play(); } catch (e) { updateNote('Tap ▶ to play'); }
  if (seekTime) audio.currentTime = seekTime;
  updateNote('');
  prefetch(i + 1);
}

// Auto-advance. Runs inside the media 'ended' event: when the next chunk is
// already prefetched we switch src + play() SYNCHRONOUSLY, which iOS allows
// (an async gap here would get the play() blocked -> stuck on part 1).
audio.addEventListener('ended', () => {
  const next = playing + 1;
  if (next >= CHUNKS.length) { updateNote('Finished'); clearActive(); clearProgress(CUR_ID); return; }
  playing = next;
  const c = CHUNKS[next];
  if (c && c.audioUrl) {
    bindChunk(c);
    audio.src = c.audioUrl;
    audio.playbackRate = RATE;
    audio.play().catch(() => updateNote('Tap ▶ to continue'));
    updateNote('');
    prefetch(next + 1);
  } else {
    updateNote('Loading part ' + (next + 1) + '…');
    ensureChunk(next).then(cc => {
      if (playing !== next) return;
      bindChunk(cc);
      audio.src = cc.audioUrl;
      audio.playbackRate = RATE;
      audio.play().catch(() => updateNote('Tap ▶ to continue'));
      updateNote('');
      prefetch(next + 1);
    }).catch(e => updateNote('Error: ' + e.message));
  }
});

// Open a saved article: switch to reader, extract text, render, play.
async function openArticle(item) {
  showView('reader');
  window.scrollTo(0, 0);
  genId++;
  CUR_ID = item.id;
  $('#status').className = '';
  $('#status').textContent = 'Extracting article…';
  $('#title').classList.add('hidden');
  $('#article').innerHTML = '';
  $('#player').classList.remove('on');
  $('#seek').value = 0;
  clearActive();
  try {
    const data = await runJob('/api/extract', { url: item.url });
    TEXT = data.text;
    totalWords = (TEXT.match(/\S+/g) || []).length;
    CHUNKS = data.chunks.map(c => ({ ...c, marks: null, audioUrl: null }));
    $('#title').textContent = item.title || data.title;
    $('#title').classList.remove('hidden');
    $('#status').textContent = '';
    renderArticle();
    $('#player').classList.add('on');
    updateTimeDisplay(0);
    const resume = loadProgress(item.id);   // continue where we left off last time
    if (resume > 0.01 && resume < 0.99) seekToChar(resume * TEXT.length);
    else playFrom(0);
  } catch (e) {
    $('#status').className = 'err';
    $('#status').textContent = 'Error: ' + e.message;
  }
}

// --- Highlight sync ---
function clearActive() { if (spans[active]) spans[active].classList.remove('active'); active = -1; }

// --- Reading pointer: free scroll + a compass back to the narrated word ---
function updateCompass() {
  const sp = spans[active];
  const inReader = !$('#readerView').classList.contains('hidden');
  if (!sp || !inReader || playing < 0) { $('#compass').classList.remove('show'); return; }
  const r = sp.getBoundingClientRect();
  if (r.bottom < 72) {                              // narrated word is above the viewport
    $('#compass').textContent = '↑'; $('#compass').classList.add('show');
  } else if (r.top > window.innerHeight - 96) {     // below the viewport (behind the player)
    $('#compass').textContent = '↓'; $('#compass').classList.add('show');
  } else {
    $('#compass').classList.remove('show');
  }
}
let compassRAF = 0;
window.addEventListener('scroll', () => {
  if (compassRAF) return;
  compassRAF = requestAnimationFrame(() => { compassRAF = 0; updateCompass(); });
}, { passive: true });
$('#compass').onclick = () => {
  const sp = spans[active];
  if (!sp) return;
  sp.scrollIntoView({ block: 'center', behavior: 'smooth' });
  sp.classList.add('flash');                        // brief pulse so it's easy to spot
  setTimeout(() => sp.classList.remove('flash'), 1100);
  $('#compass').classList.remove('show');
};
function currentMark(t) {
  let lo = 0, hi = markIndex.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (markIndex[mid].time <= t) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return ans;
}
audio.addEventListener('timeupdate', () => {
  const mi = currentMark(audio.currentTime);
  const span = mi >= 0 ? markIndex[mi].span : -1;
  if (span !== active) {
    if (spans[active]) spans[active].classList.remove('active');
    if (highlightOn && spans[span]) spans[span].classList.add('active');
    active = span;
    updateCompass();      // no forced scroll — the compass offers to catch up
  }
  const frac = articleFrac();
  if (!dragging) {
    $('#seek').value = frac * 1000;      // progress across the whole article
    updateTimeDisplay(frac);
  }
  if (Date.now() - lastSave > 4000) { lastSave = Date.now(); saveProgress(); }
});

function seekToGlobalSpan(spanIdx) {
  const marks = window._allMarks || [];
  const m = marks.find(x => x._span === spanIdx);
  if (!m) return;
  const ci = CHUNKS.findIndex(c => m.start >= c.start && m.start < c.end);
  if (ci < 0) return;
  const local = (CHUNKS[ci].marks || []).find(x => x._span === spanIdx);
  const t = local ? local.time : 0;
  if (ci === playing) { audio.currentTime = t + 0.01; audio.play(); }
  else playFrom(ci, t + 0.01);
}

// --- Seek by character position (for the whole-article progress bar + resume) ---
function chunkForChar(ch) { return CHUNKS.findIndex(c => ch >= c.start && ch < c.end); }
function charToTime(c, ch) {         // audio time of the last word starting at/before `ch`
  const marks = c.marks || [];
  let lo = 0, hi = marks.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (marks[mid].start <= ch) { ans = marks[mid].time; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}
async function seekToChar(ch) {
  ch = Math.max(0, Math.min((TEXT.length || 1) - 1, ch));
  const ci = chunkForChar(ch);
  if (ci < 0) return;
  if (ci === playing && audio.duration && CHUNKS[ci].marks) {
    audio.currentTime = charToTime(CHUNKS[ci], ch);
    audio.play().catch(() => {});
  } else {
    await playFrom(ci);
    const c = CHUNKS[ci];
    if (c && c.marks) audio.currentTime = charToTime(c, ch);
  }
}

// --- Resume position (per article, in localStorage) ---
const progKey = id => 'nvr_pos_' + id;
function saveProgress() {
  if (!CUR_ID || playing < 0) return;
  const f = articleFrac();
  try {
    if (f > 0.01 && f < 0.995) localStorage.setItem(progKey(CUR_ID), String(f));
    else localStorage.removeItem(progKey(CUR_ID));
  } catch (e) {}
}
function loadProgress(id) {
  const f = parseFloat(localStorage.getItem(progKey(id)));
  return isFinite(f) ? f : 0;
}
function clearProgress(id) { try { localStorage.removeItem(progKey(id)); } catch (e) {} }

document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });
window.addEventListener('pagehide', saveProgress);

// --- Controls ---
$('#play').onclick = () => audio.paused ? audio.play() : audio.pause();
audio.addEventListener('play', () => $('#play').textContent = '❚❚');
audio.addEventListener('pause', () => $('#play').textContent = '▶');
$('#seek').addEventListener('input', () => {
  dragging = true;
  updateTimeDisplay(parseFloat($('#seek').value) / 1000);   // live position preview
});
$('#seek').addEventListener('change', () => {
  const frac = parseFloat($('#seek').value) / 1000;
  dragging = false;
  if (TEXT) seekToChar(frac * TEXT.length);
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)
      && !$('#readerView').classList.contains('hidden')) {
    e.preventDefault(); $('#play').click();
  }
});

// --- Init ---
showView('list');
loadList();
</script>
</body>
</html>
