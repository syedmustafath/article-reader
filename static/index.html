<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Natural Voice Reader</title>
<style>
  :root {
    --bg: #ffffff; --panel: #ffffff; --ink: #1a1a1c; --muted: #8a8a8f;
    --accent: #e0662a; --hl: #ffe08a; --hl-ink: #402c00; --line: #ececef;
    --chip: #f4f4f6; --sheet: #ffffff; --uhl: rgba(255, 208, 84, .55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11; --panel: #17171a; --ink: #f1f1f3; --muted: #8e8e94;
      --accent: #f0783c; --hl: #5a4413; --hl-ink: #ffe9b3; --line: #2a2a2e;
      --chip: #242428; --sheet: #1b1b1f; --uhl: rgba(255, 200, 70, .26);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, system-ui, sans-serif; line-height: 1.6; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 12px 16px;
           padding-top: max(12px, env(safe-area-inset-top)); }
  .bar { display: flex; gap: 8px; align-items: center;
         max-width: 780px; margin: 0 auto; }
  .bar-between { justify-content: space-between; }
  .app-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .spacer { flex: 1; }
  input[type=url] {
    width: 100%; padding: 13px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 16px; }
  button { font-family: inherit; cursor: pointer; border: 1px solid var(--line);
           background: var(--bg); color: var(--ink); border-radius: 11px;
           padding: 11px 16px; font-size: 15px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent);
                   font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .icon { width: 44px; padding: 0; height: 44px; font-size: 19px; flex: none;
          display: flex; align-items: center; justify-content: center; }
  main { max-width: 720px; margin: 0 auto; padding: 26px 20px 210px; }

  /* List view */
  #list { max-width: 720px; margin: 0 auto; }
  .card { display: flex; align-items: stretch; border: 1px solid var(--line);
          border-radius: 14px; margin-bottom: 12px; background: var(--panel); overflow: hidden; }
  .card-main { flex: 1; padding: 15px 16px; cursor: pointer; min-width: 0; }
  .card-title { font-size: 17px; font-weight: 650; line-height: 1.3; margin-bottom: 5px;
                overflow-wrap: anywhere; }
  .card-meta { font-size: 13px; color: var(--muted); }
  .card .del { border: none; background: none; color: var(--muted); font-size: 24px;
               width: 46px; flex: none; }
  #listStatus { color: var(--muted); text-align: center; padding: 44px 20px; font-size: 15px; }
  #listStatus.err { color: #d0402a; }

  /* Reader view */
  #back { font-size: 28px; line-height: 1; }
  #title { font-family: -apple-system, system-ui, sans-serif; font-size: 27px;
           font-weight: 800; line-height: 1.22; margin: 0 0 22px; letter-spacing: -.01em; }
  #article { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; line-height: 1.78; }
  #article p { margin: 0 0 1.15em; }
  .w { border-radius: 5px; cursor: pointer; transition: background .08s; }
  .w.active, .w.flash { background: var(--hl); color: var(--hl-ink);
              box-shadow: 0 0 0 3px var(--hl); }

  /* Compass: appears when the narrated word is scrolled out of view */
  .compass { position: fixed; right: 16px; z-index: 15;
             bottom: calc(168px + env(safe-area-inset-bottom));
             width: 46px; height: 46px; border-radius: 50%; border: none;
             background: var(--accent); color: #fff; font-size: 20px; cursor: pointer;
             box-shadow: 0 4px 14px rgba(0,0,0,.28); display: none;
             align-items: center; justify-content: center; }
  .compass.show { display: flex; }
  #status { color: var(--muted); font-size: 15px; padding: 40px 0; text-align: center; }
  #status.err { color: #d0402a; }

  .player { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
            border-top: 1px solid var(--line); padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom)); display: none;
            box-shadow: 0 -6px 22px rgba(0,0,0,.07); }
  .player.on { display: block; }
  .pwrap { max-width: 780px; margin: 0 auto; }
  #seek { width: 100%; accent-color: var(--accent); height: 24px; display: block; }
  .times { display: flex; justify-content: space-between; margin: 0 2px 4px;
           font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .transport { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .bigplay { width: 62px; height: 62px; border-radius: 50%; background: var(--accent);
             border: none; color: #fff; padding: 0;
             display: flex; align-items: center; justify-content: center; }
  .bigplay svg { width: 30px; height: 30px; }
  .tbtn { width: 46px; height: 46px; border: none; background: none; color: var(--ink);
          padding: 0; display: flex; align-items: center; justify-content: center; }
  .tbtn svg { width: 27px; height: 27px; }
  .tbtn:disabled { opacity: .32; }
  #speedChip { justify-self: start; background: var(--chip); border-color: transparent;
               padding: 8px 12px; font-size: 14px; font-weight: 600;
               font-variant-numeric: tabular-nums; }
  #note { text-align: center; color: var(--muted); font-size: 12px; min-height: 15px;
          margin-top: 6px; }

  /* Bottom sheets */
  .sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
             opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheetbg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
           background: var(--sheet); border-radius: 20px 20px 0 0;
           padding: 8px 20px max(20px, env(safe-area-inset-bottom));
           transform: translateY(110%); transition: transform .25s ease;
           box-shadow: 0 -10px 40px rgba(0,0,0,.2); max-width: 520px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line);
          margin: 8px auto 16px; }
  .field { margin: 0 0 20px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--muted);
                 text-transform: uppercase; letter-spacing: .04em; margin-bottom: 9px; }
  #voice { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 12px;
           background: var(--bg); color: var(--ink); font-size: 16px; }
  .speeds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .speeds button { font-variant-numeric: tabular-nums; padding: 13px 0; font-size: 15px; }
  .speeds button.sel { background: var(--accent); color: #fff; border-color: var(--accent);
                       font-weight: 700; }
  .add-err { color: #d0402a; font-size: 14px; min-height: 18px; margin: 2px 0 10px; }
  #addSubmit, #sheetDone { width: 100%; margin-top: 4px; padding: 14px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between;
                gap: 12px; font-size: 16px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: var(--line); border-radius: 999px;
                   transition: background .2s; cursor: pointer; }
  .switch .track::before { content: ''; position: absolute; left: 3px; top: 3px;
                           width: 22px; height: 22px; background: #fff; border-radius: 50%;
                           transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(20px); }

  /* User highlights in the article */
  .hl { background: var(--uhl); border-radius: 3px; cursor: pointer; }
  .hl.has-note { box-shadow: inset 0 -2px 0 var(--accent); }

  /* Floating selection toolbar */
  .selbar { position: fixed; z-index: 30; display: none; gap: 2px;
            background: #202024; border-radius: 12px; padding: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .selbar.show { display: flex; }
  .selbar button { background: none; border: none; color: #fff; font-size: 14px;
                   font-weight: 600; padding: 9px 14px; border-radius: 9px; white-space: nowrap; }
  .selbar button:active { background: rgba(255,255,255,.16); }

  /* Highlight note sheet */
  .hl-quote { font-family: Georgia, serif; font-size: 16px; line-height: 1.5;
              background: var(--chip); border-radius: 12px; padding: 12px 14px;
              margin: 4px 0 16px; max-height: 30vh; overflow: auto; }
  #hlNote { width: 100%; min-height: 88px; padding: 12px; border: 1px solid var(--line);
            border-radius: 12px; background: var(--bg); color: var(--ink);
            font-family: inherit; font-size: 16px; resize: vertical; }
  .hl-actions { display: flex; gap: 10px; margin-top: 6px; }
  .hl-actions #hlSave { flex: 1; padding: 14px; }
  .hl-actions #hlDelete { padding: 14px 18px; color: #d0402a; }

  /* Highlights screen */
  #hlList { max-width: 720px; margin: 0 auto; }
  .hl-group { margin-bottom: 24px; }
  .hl-group-title { font-size: 13px; font-weight: 700; color: var(--muted);
                    text-transform: uppercase; letter-spacing: .03em; margin-bottom: 12px;
                    overflow-wrap: anywhere; }
  .hl-item { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px;
             margin-bottom: 16px; cursor: pointer; }
  .hl-item-quote { font-family: Georgia, serif; font-size: 17px; line-height: 1.5; }
  .hl-item-note { font-size: 14px; color: var(--muted); margin-top: 6px; }
  #hlListStatus { color: var(--muted); text-align: center; padding: 44px 20px; font-size: 15px; }
  #hlListStatus.err { color: #d0402a; }
  .hidden { display: none; }
</style>
</head>
<body>

<!-- ===== LIST VIEW ===== -->
<div id="listView">
  <header>
    <div class="bar bar-between">
      <h1 class="app-title">Reading List</h1>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="hlScreenBtn" class="icon" aria-label="Highlights">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        </button>
        <button id="addBtn" class="primary">+ Add</button>
      </div>
    </div>
  </header>
  <main>
    <div id="list"></div>
    <div id="listStatus"></div>
  </main>
</div>

<!-- ===== HIGHLIGHTS VIEW ===== -->
<div id="highlightsView" class="hidden">
  <header>
    <div class="bar">
      <button id="hlBack" class="icon" aria-label="Back to list">‹</button>
      <h1 class="app-title" style="margin-left:4px;">Highlights</h1>
    </div>
  </header>
  <main>
    <div id="hlList"></div>
    <div id="hlListStatus"></div>
  </main>
</div>

<!-- ===== READER VIEW ===== -->
<div id="readerView" class="hidden">
  <header>
    <div class="bar">
      <button id="back" class="icon" aria-label="Back to list">‹</button>
      <div class="spacer"></div>
      <button id="gear" class="icon" aria-label="Settings">⚙</button>
    </div>
  </header>
  <main>
    <h1 id="title" class="hidden"></h1>
    <div id="status"></div>
    <div id="article"></div>
  </main>
  <div class="player" id="player">
    <div class="pwrap">
      <input id="seek" type="range" min="0" max="1000" value="0">
      <div class="times"><span id="time-cur">0:00</span><span id="time-rem">0:00</span></div>
      <div class="controls">
        <button id="speedChip">1.25×</button>
        <div class="transport">
          <button id="prev" class="tbtn" aria-label="Previous part">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="6" width="2.4" height="12" rx="1"/><path d="M19 6.2v11.6L10 12z"/></svg>
          </button>
          <button id="play" class="bigplay" aria-label="Play or pause"></button>
          <button id="next" class="tbtn" aria-label="Next part">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 6.2v11.6L14 12z"/><rect x="16.6" y="6" width="2.4" height="12" rx="1"/></svg>
          </button>
        </div>
        <span></span>
      </div>
      <div id="note"></div>
    </div>
  </div>
  <button class="compass" id="compass" aria-label="Scroll to the word being read">↓</button>
</div>

<audio id="audio"></audio>

<!-- Floating selection toolbar (highlight / note) -->
<div class="selbar" id="selbar">
  <button id="selHighlight">Highlight</button>
  <button id="selNote">＋ Note</button>
</div>

<!-- ===== SHEETS (shared overlay) ===== -->
<div class="sheetbg" id="sheetBg"></div>

<div class="sheet" id="hlSheet">
  <div class="grab"></div>
  <div class="hl-quote" id="hlQuote"></div>
  <div class="field">
    <div class="field-label">Note</div>
    <textarea id="hlNote" placeholder="Add a note…"></textarea>
  </div>
  <div class="hl-actions">
    <button id="hlDelete">Delete</button>
    <button id="hlSave" class="primary">Save</button>
  </div>
</div>

<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <div class="field">
    <div class="field-label">Article URL</div>
    <input id="addUrl" type="url" placeholder="https://…"
           autocomplete="off" autocapitalize="off" autocorrect="off">
  </div>
  <div id="addErr" class="add-err"></div>
  <button id="addSubmit" class="primary">Add to list</button>
</div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="field">
    <div class="field-label">Voice</div>
    <select id="voice"></select>
  </div>
  <div class="field">
    <div class="field-label">Speed</div>
    <div class="speeds" id="speeds"></div>
  </div>
  <div class="field">
    <div class="field-label">Reading guide</div>
    <div class="switch-row">
      <span>Highlight the word being read</span>
      <label class="switch"><input type="checkbox" id="hlToggle"><span class="track"></span></label>
    </div>
  </div>
  <button id="sheetDone" class="primary">Done</button>
</div>

<script>
const $ = s => document.querySelector(s);
const audio = $('#audio');

let TEXT = '';
let CHUNKS = [];
let spans = [];
let markIndex = [];       // {time, span} for the playing chunk
let playing = -1;
let active = -1;
let voice = 'en-US-AndrewMultilingualNeural';
let genId = 0;
let totalWords = 0;       // article word count, for ETA
let CUR_ID = null;        // id of the open article, for resume
let dragging = false;     // user is scrubbing the progress bar
let lastSave = 0;         // throttle for resume-position saves
let highlightOn = localStorage.getItem('nvr_highlight') !== 'off';  // reading-guide highlight
let HIGHLIGHTS = [];      // user highlights for the open article: {id,start,end,quote,note,...}
let CUR_URL = null, CUR_TITLE = null;   // open article context (for saving highlights)
let EDIT_HL = null;       // highlight currently open in the note sheet
const WPM_1X = 180;       // measured pace of the default voice (Andrew) at 1x
const SPEEDS = [1.0, 1.1, 1.2, 1.25, 1.35, 1.5];  // finer steps, capped at 1.5x
// default 1.25x, but remember the user's last-used speed across sessions
let RATE = (() => { const v = parseFloat(localStorage.getItem('nvr_rate')); return SPEEDS.includes(v) ? v : 1.25; })();

const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = s => escapeHtml(s).replace(/\n{2,}/g, '</p><p>').replace(/\n/g, ' ');

// Runs a slow server task via the job API: POST starts it and returns a job id
// instantly, then we poll /api/job/{id} until it's done. This keeps every request
// under ~1s so Cloudflare's edge (which resets slower HTTP/2 requests) never trips.
async function runJob(url, body) {
  const start = await fetch(url, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  const s = await start.json();
  if (!start.ok) throw new Error(s.detail || start.statusText);
  const job = s.job;
  for (let tries = 0; tries < 240; tries++) {   // ~2 min ceiling
    await new Promise(r => setTimeout(r, 500));
    const r = await fetch('/api/job/' + job);
    if (!r.ok) throw new Error('Lost track of the job — try again.');
    const j = await r.json();
    if (j.status === 'done') return j.result;
    if (j.status === 'error') throw new Error(j.error);
  }
  throw new Error('Timed out.');
}

// --- View switching ---
function showView(v) {
  $('#listView').classList.toggle('hidden', v !== 'list');
  $('#readerView').classList.toggle('hidden', v !== 'reader');
  $('#highlightsView').classList.toggle('hidden', v !== 'highlights');
}

// Direct JSON request for the fast highlight endpoints (Supabase ops are < 1s).
async function apiJSON(method, url, body) {
  const opt = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  const txt = await r.text();
  const d = txt ? JSON.parse(txt) : null;
  if (!r.ok) throw new Error((d && d.detail) || r.statusText);
  return d;
}

// --- Voices + speed presets ---
fetch('/api/voices').then(r => r.json()).then(vs => {
  $('#voice').innerHTML = vs.map(v => `<option value="${v.id}">${v.label}</option>`).join('');
  voice = vs[0].id;
});
$('#voice').addEventListener('change', e => { voice = e.target.value; });

$('#speeds').innerHTML = SPEEDS.map(s =>
  `<button data-s="${s}"${s === RATE ? ' class="sel"' : ''}>${s}×</button>`).join('');
$('#speeds').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setRate(parseFloat(b.dataset.s));
});
function setRate(r) {
  RATE = r; audio.playbackRate = r;
  try { localStorage.setItem('nvr_rate', r); } catch (e) {}
  $('#speedChip').textContent = r + '×';
  $('#speeds').querySelectorAll('button').forEach(b =>
    b.classList.toggle('sel', parseFloat(b.dataset.s) === r));
  if (TEXT) updateTimeDisplay(articleFrac());   // ETA reflects the new speed at once
}
setRate(RATE);   // sync chip / selected preset / stored value on load
audio.addEventListener('loadedmetadata', () => { audio.playbackRate = RATE; });

// --- Whole-article progress + ETA (word-based, scales with speed) ---
function etaTotalSec() { return totalWords ? (totalWords / (WPM_1X * RATE)) * 60 : 0; }
function articleFrac() {           // fraction of the whole article read so far
  const c = CHUNKS[playing];
  if (!c || !audio.duration || !TEXT) return 0;
  const within = Math.min(1, audio.currentTime / audio.duration);
  return Math.min(1, (c.start + within * (c.end - c.start)) / TEXT.length);
}
function updateTimeDisplay(frac) {
  const total = etaTotalSec();
  const cur = frac * total;
  $('#time-cur').textContent = fmt(cur);
  $('#time-rem').textContent = '-' + fmt(Math.max(0, total - cur));
}

// --- Bottom sheets ---
function openSheetEl(el) { el.classList.add('open'); $('#sheetBg').classList.add('open'); }
function closeSheets() {
  $('#sheet').classList.remove('open');
  $('#addSheet').classList.remove('open');
  $('#hlSheet').classList.remove('open');
  $('#sheetBg').classList.remove('open');
}
$('#gear').onclick = () => openSheetEl($('#sheet'));
$('#speedChip').onclick = () => openSheetEl($('#sheet'));
$('#sheetBg').onclick = closeSheets;
$('#sheetDone').onclick = closeSheets;

// Reading-guide highlight toggle (persisted)
$('#hlToggle').checked = highlightOn;
$('#hlToggle').addEventListener('change', e => {
  highlightOn = e.target.checked;
  try { localStorage.setItem('nvr_highlight', highlightOn ? 'on' : 'off'); } catch (err) {}
  if (spans[active]) spans[active].classList.toggle('active', highlightOn);
});

// ============================================================
//  READING LIST
// ============================================================
async function loadList() {
  $('#listStatus').className = '';
  $('#listStatus').textContent = 'Loading…';
  try {
    const res = await fetch('/api/articles');
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    renderList(await res.json());
  } catch (e) {
    $('#list').innerHTML = '';
    $('#listStatus').className = 'err';
    $('#listStatus').textContent = 'Error: ' + e.message;
  }
}

function cardHtml(a) {
  const date = a.added_at
    ? new Date(a.added_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  const p = loadProgress(a.id);
  const read = p > 0.01 && p < 0.99 ? `${Math.round(p * 100)}% read` : '';
  const meta = [a.domain, date, a.est_minutes ? `~${a.est_minutes} min` : '', read]
    .filter(Boolean).join(' · ');
  return `<div class="card" data-id="${a.id}">
    <div class="card-main">
      <div class="card-title">${escapeHtml(a.title || a.url)}</div>
      <div class="card-meta">${escapeHtml(meta)}</div>
    </div>
    <button class="del" aria-label="Delete">×</button>
  </div>`;
}

function renderList(items) {
  if (!items.length) {
    $('#list').innerHTML = '';
    $('#listStatus').className = '';
    $('#listStatus').textContent = 'No saved articles yet. Tap “+ Add article” to save one.';
    return;
  }
  $('#listStatus').textContent = '';
  $('#list').innerHTML = items.map(cardHtml).join('');
  $('#list').querySelectorAll('.card').forEach(el => {
    const item = items.find(x => x.id === el.dataset.id);
    el.querySelector('.card-main').onclick = () => openArticle(item);
    el.querySelector('.del').onclick = () => deleteArticle(el.dataset.id, el);
  });
}

async function deleteArticle(id, el) {
  el.style.opacity = .4;
  try {
    const r = await fetch('/api/articles/' + id, { method: 'DELETE' });
    if (!r.ok) throw new Error((await r.json()).detail || 'Delete failed');
    el.remove();
    if (!$('#list').children.length) renderList([]);
  } catch (e) {
    el.style.opacity = 1;
    alert('Could not delete: ' + e.message);
  }
}

async function addArticle() {
  const url = $('#addUrl').value.trim();
  if (!url) return;
  $('#addSubmit').disabled = true;
  $('#addSubmit').textContent = 'Adding…';
  $('#addErr').textContent = '';
  try {
    await runJob('/api/articles', { url });
    closeSheets();
    await loadList();
  } catch (e) {
    $('#addErr').textContent = 'Error: ' + e.message;
  } finally {
    $('#addSubmit').disabled = false;
    $('#addSubmit').textContent = 'Add to list';
  }
}
$('#addBtn').onclick = () => { $('#addUrl').value = ''; $('#addErr').textContent = ''; openSheetEl($('#addSheet')); $('#addUrl').focus(); };
$('#addSubmit').onclick = addArticle;
$('#addUrl').addEventListener('keydown', e => { if (e.key === 'Enter') addArticle(); });

$('#back').onclick = () => {
  saveProgress();       // remember where we are for next time
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  genId++;              // cancel any in-flight synthesis
  playing = -1;
  $('#player').classList.remove('on');
  $('#compass').classList.remove('show');
  clearActive();
  loadList();           // refresh cards so the "% read" badge updates
  showView('list');
};

// ============================================================
//  ARTICLE READER  (unchanged playback engine)
// ============================================================
// Every text run becomes a span carrying data-s (its char offset in TEXT), so a
// text selection maps cleanly to character offsets. Word spans (.w) keep data-i
// for narration highlight + click-to-seek; any run inside a saved highlight range
// gets .hl + data-hl. Paragraph breaks (\n\n) split <p>s between spans.
function hlIdAt(pos) {
  for (const h of HIGHLIGHTS) if (pos >= h.start && pos < h.end) return h.id;
  return null;
}
function renderArticle() {
  const marks = [];
  CHUNKS.forEach(c => (c.marks || []).forEach(m => marks.push(m)));
  marks.sort((a, b) => a.start - b.start);
  marks.forEach((m, i) => m._span = i);
  window._allMarks = marks;

  let html = '<p>';
  const spanFor = (s, e, extraCls, dataI) => {
    const hid = hlIdAt(s);
    const cls = extraCls + (hid ? ' hl' : '') + (hid && hlNote(hid) ? ' has-note' : '');
    const di = dataI != null ? ` data-i="${dataI}"` : '';
    const dh = hid ? ` data-hl="${hid}"` : '';
    return `<span class="${cls}" data-s="${s}"${di}${dh}>${escapeHtml(TEXT.slice(s, e))}</span>`;
  };
  const emitGap = (s, e) => {                 // plain text between words; handle paragraphs
    let idx = s;
    for (const part of TEXT.slice(s, e).split(/(\n{2,})/)) {
      if (!part) continue;
      if (/^\n{2,}$/.test(part)) { html += '</p><p>'; idx += part.length; continue; }
      const hid = hlIdAt(idx);
      const cls = 'g' + (hid ? ' hl' : '') + (hid && hlNote(hid) ? ' has-note' : '');
      const dh = hid ? ` data-hl="${hid}"` : '';
      html += `<span class="${cls}" data-s="${idx}"${dh}>${escapeHtml(part).replace(/\n/g, ' ')}</span>`;
      idx += part.length;
    }
  };
  let cur = 0;
  marks.forEach((m, i) => {
    if (m.start > cur) emitGap(cur, m.start);
    html += spanFor(m.start, m.end, 'w', i);
    cur = m.end;
  });
  if (cur < TEXT.length) emitGap(cur, TEXT.length);
  $('#article').innerHTML = html + '</p>';
  spans = Array.from(document.querySelectorAll('.w'));
}
function hlNote(id) { const h = HIGHLIGHTS.find(x => String(x.id) === String(id)); return h && h.note; }

function fmt(t) {
  if (!isFinite(t)) t = 0;
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}

// --- Synthesis (dedup + prefetch) ---
async function ensureChunk(i) {
  const c = CHUNKS[i];
  if (!c || c.audioUrl) return c;
  if (c._promise) return c._promise;
  const mine = genId;
  c._promise = (async () => {
    const data = await runJob('/api/tts', { text: TEXT.slice(c.start, c.end), voice });
    if (mine !== genId) return c;
    c.audioUrl = data.audio_url;
    c.marks = data.marks.map(m => ({ start: m.start + c.start, end: m.end + c.start, time: m.time }));
    renderArticle();
    return c;
  })();
  return c._promise;
}
// Keep a lookahead of 2 chunks warming up so the next part is ready in time.
function prefetch(i) { for (let j = i; j <= i + 2; j++) ensureChunk(j).catch(() => {}); }

function bindChunk(c) {
  markIndex = (c.marks || []).map(m => ({ time: m.time, span: m._span }))
                             .sort((a, b) => a.time - b.time);
}

// Status line under the player: "Part 2 of 44 · <message>".
function updateNote(msg) {
  const total = CHUNKS.length;
  const part = total > 1 && playing >= 0 ? `Part ${playing + 1} of ${total}` : '';
  $('#note').textContent = [part, msg].filter(Boolean).join(' · ');
  updateTransport();
}

// Initial play / seek target (runs inside a user gesture, so await+play is fine).
async function playFrom(i, seekTime = 0) {
  if (i < 0 || i >= CHUNKS.length) return;
  const mine = genId;
  playing = i;
  updateNote('Loading audio…');
  prefetch(i);
  let c;
  try { c = await ensureChunk(i); }
  catch (e) { updateNote('Error: ' + e.message); return; }
  if (mine !== genId || playing !== i) return;
  bindChunk(c);
  audio.src = c.audioUrl;
  audio.playbackRate = RATE;
  try { await audio.play(); } catch (e) { updateNote('Tap ▶ to play'); }
  if (seekTime) audio.currentTime = seekTime;
  updateNote('');
  prefetch(i + 1);
}

// Auto-advance. Runs inside the media 'ended' event: when the next chunk is
// already prefetched we switch src + play() SYNCHRONOUSLY, which iOS allows
// (an async gap here would get the play() blocked -> stuck on part 1).
audio.addEventListener('ended', () => {
  const next = playing + 1;
  if (next >= CHUNKS.length) { updateNote('Finished'); clearActive(); clearProgress(CUR_ID); return; }
  playing = next;
  const c = CHUNKS[next];
  if (c && c.audioUrl) {
    bindChunk(c);
    audio.src = c.audioUrl;
    audio.playbackRate = RATE;
    audio.play().catch(() => updateNote('Tap ▶ to continue'));
    updateNote('');
    prefetch(next + 1);
  } else {
    updateNote('Loading part ' + (next + 1) + '…');
    ensureChunk(next).then(cc => {
      if (playing !== next) return;
      bindChunk(cc);
      audio.src = cc.audioUrl;
      audio.playbackRate = RATE;
      audio.play().catch(() => updateNote('Tap ▶ to continue'));
      updateNote('');
      prefetch(next + 1);
    }).catch(e => updateNote('Error: ' + e.message));
  }
});

// Open a saved article: switch to reader, extract text, render, play.
// `seekChar` (optional) jumps to a spot — used when opening from a highlight.
async function openArticle(item, seekChar) {
  showView('reader');
  window.scrollTo(0, 0);
  genId++;
  CUR_ID = item.id; CUR_URL = item.url; CUR_TITLE = item.title;
  HIGHLIGHTS = [];
  $('#status').className = '';
  $('#status').textContent = 'Extracting article…';
  $('#title').classList.add('hidden');
  $('#article').innerHTML = '';
  $('#player').classList.remove('on');
  $('#seek').value = 0;
  clearActive();
  try {
    const [data, hls] = await Promise.all([
      runJob('/api/extract', { url: item.url }),
      apiJSON('GET', '/api/highlights?article_id=' + encodeURIComponent(item.id)).catch(() => [])
    ]);
    TEXT = data.text;
    totalWords = (TEXT.match(/\S+/g) || []).length;
    CHUNKS = data.chunks.map(c => ({ ...c, marks: null, audioUrl: null }));
    HIGHLIGHTS = hls || [];
    $('#title').textContent = item.title || data.title;
    $('#title').classList.remove('hidden');
    $('#status').textContent = '';
    renderArticle();
    $('#player').classList.add('on');
    updateTimeDisplay(0);
    if (seekChar != null) { seekToChar(seekChar); scrollToChar(seekChar); }
    else {
      const resume = loadProgress(item.id);   // continue where we left off last time
      if (resume > 0.01 && resume < 0.99) seekToChar(resume * TEXT.length);
      else playFrom(0);
    }
  } catch (e) {
    $('#status').className = 'err';
    $('#status').textContent = 'Error: ' + e.message;
  }
}

// --- Highlight sync ---
function clearActive() { if (spans[active]) spans[active].classList.remove('active'); active = -1; }

// --- Reading pointer: free scroll + a compass back to the narrated word ---
function updateCompass() {
  const sp = spans[active];
  const inReader = !$('#readerView').classList.contains('hidden');
  if (!sp || !inReader || playing < 0) { $('#compass').classList.remove('show'); return; }
  const r = sp.getBoundingClientRect();
  if (r.bottom < 72) {                              // narrated word is above the viewport
    $('#compass').textContent = '↑'; $('#compass').classList.add('show');
  } else if (r.top > window.innerHeight - 96) {     // below the viewport (behind the player)
    $('#compass').textContent = '↓'; $('#compass').classList.add('show');
  } else {
    $('#compass').classList.remove('show');
  }
}
let compassRAF = 0;
window.addEventListener('scroll', () => {
  $('#selbar').classList.remove('show');   // selection toolbar shouldn't float while scrolling
  if (compassRAF) return;
  compassRAF = requestAnimationFrame(() => { compassRAF = 0; updateCompass(); });
}, { passive: true });
$('#compass').onclick = () => {
  const sp = spans[active];
  if (!sp) return;
  sp.scrollIntoView({ block: 'center', behavior: 'smooth' });
  sp.classList.add('flash');                        // brief pulse so it's easy to spot
  setTimeout(() => sp.classList.remove('flash'), 1100);
  $('#compass').classList.remove('show');
};
function currentMark(t) {
  let lo = 0, hi = markIndex.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (markIndex[mid].time <= t) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return ans;
}
audio.addEventListener('timeupdate', () => {
  const mi = currentMark(audio.currentTime);
  const span = mi >= 0 ? markIndex[mi].span : -1;
  if (span !== active) {
    if (spans[active]) spans[active].classList.remove('active');
    if (highlightOn && spans[span]) spans[span].classList.add('active');
    active = span;
    updateCompass();      // no forced scroll — the compass offers to catch up
  }
  const frac = articleFrac();
  if (!dragging) {
    $('#seek').value = frac * 1000;      // progress across the whole article
    updateTimeDisplay(frac);
  }
  if (Date.now() - lastSave > 4000) { lastSave = Date.now(); saveProgress(); }
});

function seekToGlobalSpan(spanIdx) {
  const marks = window._allMarks || [];
  const m = marks.find(x => x._span === spanIdx);
  if (!m) return;
  const ci = CHUNKS.findIndex(c => m.start >= c.start && m.start < c.end);
  if (ci < 0) return;
  const local = (CHUNKS[ci].marks || []).find(x => x._span === spanIdx);
  const t = local ? local.time : 0;
  if (ci === playing) { audio.currentTime = t + 0.01; audio.play(); }
  else playFrom(ci, t + 0.01);
}

// ============================================================
//  HIGHLIGHTS & NOTES
// ============================================================
// Tapping a highlight opens its note; tapping a plain word seeks there.
$('#article').addEventListener('click', e => {
  if (window.getSelection && !window.getSelection().isCollapsed) return;  // mid-selection
  const hlEl = e.target.closest('[data-hl]');
  if (hlEl) { openHighlight(hlEl.dataset.hl); return; }
  const w = e.target.closest('.w');
  if (w) seekToGlobalSpan(+w.dataset.i);
});

// Map a selection endpoint (text node + offset) to a character offset in TEXT.
function charOffsetOf(node, offset) {
  const el = node.nodeType === 3 ? node.parentElement : node;
  const span = el && el.closest('[data-s]');
  if (!span) return null;
  return +span.dataset.s + (node.nodeType === 3 ? offset : 0);
}
// Expand a raw [a,b] range to cover the whole words it touches.
function snapToWords(a, b) {
  const marks = window._allMarks || [];
  if (!marks.length) return { start: a, end: b };
  let s = null, e = null;
  for (const m of marks) if (m.end > a) { s = m; break; }
  for (const m of marks) { if (m.start < b) e = m; else break; }
  if (!s || !e || s.start >= e.end) return null;
  return { start: s.start, end: e.end };
}
function currentSelectionRange() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  const art = $('#article');
  if (!art.contains(range.startContainer) || !art.contains(range.endContainer)) return null;
  const a = charOffsetOf(range.startContainer, range.startOffset);
  const b = charOffsetOf(range.endContainer, range.endOffset);
  if (a == null || b == null) return null;
  return snapToWords(Math.min(a, b), Math.max(a, b));
}

// Floating "Highlight / Note" toolbar over the current selection
function updateSelToolbar() {
  const tb = $('#selbar');
  const snapped = currentSelectionRange();
  if (!snapped) { tb.classList.remove('show'); return; }
  tb.dataset.start = snapped.start; tb.dataset.end = snapped.end;
  const rect = window.getSelection().getRangeAt(0).getBoundingClientRect();
  const top = rect.top - 52;
  tb.style.top = (top < 60 ? rect.bottom + 8 : top) + 'px';
  tb.style.left = Math.min(window.innerWidth - 160, Math.max(8, rect.left + rect.width / 2 - 74)) + 'px';
  tb.classList.add('show');
}
['mouseup', 'touchend'].forEach(ev =>
  document.addEventListener(ev, () => setTimeout(updateSelToolbar, 10)));
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) $('#selbar').classList.remove('show');
});

async function createHighlight(withNote) {
  const start = +$('#selbar').dataset.start, end = +$('#selbar').dataset.end;
  if (!(end > start)) return;
  const quote = TEXT.slice(start, end);
  $('#selbar').classList.remove('show');
  window.getSelection().removeAllRanges();
  const tmp = { id: 'tmp-' + Date.now(), article_id: CUR_ID, url: CUR_URL, title: CUR_TITLE,
                start, end, quote, note: '' };
  HIGHLIGHTS.push(tmp);
  renderArticle();
  try {
    const row = await apiJSON('POST', '/api/highlights',
      { article_id: CUR_ID, url: CUR_URL, title: CUR_TITLE, start, end, quote, note: '' });
    Object.assign(tmp, row);                 // adopt the real id
    renderArticle();
  } catch (e) {
    HIGHLIGHTS = HIGHLIGHTS.filter(h => h !== tmp);
    renderArticle();
    alert('Could not save highlight: ' + e.message);
    return;
  }
  if (withNote) openHighlight(tmp.id);
}
$('#selHighlight').onclick = () => createHighlight(false);
$('#selNote').onclick = () => createHighlight(true);

function openHighlight(id) {
  const h = HIGHLIGHTS.find(x => String(x.id) === String(id));
  if (!h) return;
  EDIT_HL = h;
  $('#hlQuote').textContent = h.quote;
  $('#hlNote').value = h.note || '';
  openSheetEl($('#hlSheet'));
}
$('#hlSave').onclick = async () => {
  if (!EDIT_HL) return;
  const note = $('#hlNote').value.trim();
  EDIT_HL.note = note;
  closeSheets();
  renderArticle();
  try { await apiJSON('PATCH', '/api/highlights/' + EDIT_HL.id, { note }); } catch (e) {}
};
$('#hlDelete').onclick = async () => {
  if (!EDIT_HL) return;
  const id = EDIT_HL.id;
  HIGHLIGHTS = HIGHLIGHTS.filter(h => h.id !== id);
  closeSheets();
  renderArticle();
  try { await apiJSON('DELETE', '/api/highlights/' + id); } catch (e) {}
};
// keep the text selection alive when tapping the toolbar (dataset already holds the range)
$('#selbar').addEventListener('mousedown', e => e.preventDefault());

// Scroll a character position into view and flash it (used when opening a highlight).
function scrollToChar(ch) {
  const el = [...$('#article').querySelectorAll('[data-s]')]
    .reverse().find(s => +s.dataset.s <= ch);
  if (!el) return;
  el.scrollIntoView({ block: 'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1500);
}

// --- Highlights homepage screen ---
$('#hlScreenBtn').onclick = openHighlightsScreen;
$('#hlBack').onclick = () => showView('list');

async function openHighlightsScreen() {
  showView('highlights');
  window.scrollTo(0, 0);
  $('#hlList').innerHTML = '';
  $('#hlListStatus').className = '';
  $('#hlListStatus').textContent = 'Loading…';
  try {
    renderHighlightsScreen(await apiJSON('GET', '/api/highlights'));
  } catch (e) {
    $('#hlListStatus').className = 'err';
    $('#hlListStatus').textContent = 'Error: ' + e.message;
  }
}

function renderHighlightsScreen(all) {
  if (!all || !all.length) {
    $('#hlListStatus').textContent = 'No highlights yet. Select text in an article to save one.';
    return;
  }
  $('#hlListStatus').textContent = '';
  const groups = new Map();
  all.forEach(h => {
    if (!groups.has(h.article_id))
      groups.set(h.article_id, { title: h.title, url: h.url, id: h.article_id, items: [] });
    groups.get(h.article_id).items.push(h);
  });
  $('#hlList').innerHTML = [...groups.values()].map(g => `
    <div class="hl-group">
      <div class="hl-group-title">${escapeHtml(g.title || g.url || 'Article')}</div>
      ${g.items.map(h => `
        <div class="hl-item" data-aid="${escapeHtml(g.id)}" data-url="${escapeHtml(g.url || '')}"
             data-title="${escapeHtml(g.title || '')}" data-start="${h.start}">
          <div class="hl-item-quote">${escapeHtml(h.quote || '')}</div>
          ${h.note ? `<div class="hl-item-note">${escapeHtml(h.note)}</div>` : ''}
        </div>`).join('')}
    </div>`).join('');
  $('#hlList').querySelectorAll('.hl-item').forEach(el => {
    el.onclick = () => openArticle(
      { id: el.dataset.aid, url: el.dataset.url, title: el.dataset.title }, +el.dataset.start);
  });
}

// --- Seek by character position (for the whole-article progress bar + resume) ---
function chunkForChar(ch) { return CHUNKS.findIndex(c => ch >= c.start && ch < c.end); }
function charToTime(c, ch) {         // audio time of the last word starting at/before `ch`
  const marks = c.marks || [];
  let lo = 0, hi = marks.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (marks[mid].start <= ch) { ans = marks[mid].time; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}
async function seekToChar(ch) {
  ch = Math.max(0, Math.min((TEXT.length || 1) - 1, ch));
  const ci = chunkForChar(ch);
  if (ci < 0) return;
  if (ci === playing && audio.duration && CHUNKS[ci].marks) {
    audio.currentTime = charToTime(CHUNKS[ci], ch);
    audio.play().catch(() => {});
  } else {
    await playFrom(ci);
    const c = CHUNKS[ci];
    if (c && c.marks) audio.currentTime = charToTime(c, ch);
  }
}

// --- Resume position (per article, in localStorage) ---
const progKey = id => 'nvr_pos_' + id;
function saveProgress() {
  if (!CUR_ID || playing < 0) return;
  const f = articleFrac();
  try {
    if (f > 0.01 && f < 0.995) localStorage.setItem(progKey(CUR_ID), String(f));
    else localStorage.removeItem(progKey(CUR_ID));
  } catch (e) {}
}
function loadProgress(id) {
  const f = parseFloat(localStorage.getItem(progKey(id)));
  return isFinite(f) ? f : 0;
}
function clearProgress(id) { try { localStorage.removeItem(progKey(id)); } catch (e) {} }

document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });
window.addEventListener('pagehide', saveProgress);

// --- Controls ---
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>';
$('#play').innerHTML = ICON_PLAY;
$('#play').onclick = () => audio.paused ? audio.play() : audio.pause();
audio.addEventListener('play', () => $('#play').innerHTML = ICON_PAUSE);
audio.addEventListener('pause', () => $('#play').innerHTML = ICON_PLAY);

// Previous/next part. Prev restarts the current part if we're >3s in (podcast-style).
$('#prev').onclick = () => {
  if (playing < 0) return;
  if (audio.currentTime > 3 || playing === 0) { audio.currentTime = 0; audio.play(); }
  else playFrom(playing - 1);
};
$('#next').onclick = () => {
  if (playing >= 0 && playing + 1 < CHUNKS.length) playFrom(playing + 1);
};
function updateTransport() {
  $('#prev').disabled = playing < 0;
  $('#next').disabled = !(playing >= 0 && playing + 1 < CHUNKS.length);
}
$('#seek').addEventListener('input', () => {
  dragging = true;
  updateTimeDisplay(parseFloat($('#seek').value) / 1000);   // live position preview
});
$('#seek').addEventListener('change', () => {
  const frac = parseFloat($('#seek').value) / 1000;
  dragging = false;
  if (TEXT) seekToChar(frac * TEXT.length);
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)
      && !$('#readerView').classList.contains('hidden')) {
    e.preventDefault(); $('#play').click();
  }
});

// --- Init ---
showView('list');
loadList();
</script>
