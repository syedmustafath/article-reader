<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tolkien</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#2417cc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tolkien">
<link rel="apple-touch-icon" href="/static/tolkien-icon-180.png">
<link rel="icon" type="image/png" href="/static/tolkien-icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #ffffff; --ink: #1a1a1c; --muted: #8a8a8f;
    --accent: #2417cc; --hl: #ffe08a; --hl-ink: #402c00; --line: #ececef;
    --chip: #f4f4f6; --sheet: #ffffff; --uhl: rgba(255, 208, 84, .55);
    --brand: #2417cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f11; --panel: #17171a; --ink: #f1f1f3; --muted: #8e8e94;
      --accent: #6a5dff; --hl: #5a4413; --hl-ink: #ffe9b3; --line: #2a2a2e;
      --chip: #242428; --sheet: #1b1b1f; --uhl: rgba(255, 200, 70, .26);
      --brand: #2417cc;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, system-ui, sans-serif; line-height: 1.6; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 12px 16px;
           padding-top: max(12px, env(safe-area-inset-top)); }
  .bar { display: flex; gap: 8px; align-items: center;
         max-width: 780px; margin: 0 auto; }
  .bar-between { justify-content: space-between; }
  .app-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .spacer { flex: 1; }
  input[type=url] {
    width: 100%; padding: 13px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); color: var(--ink); font-size: 16px; }
  button { font-family: inherit; cursor: pointer; border: 1px solid var(--line);
           background: var(--bg); color: var(--ink); border-radius: 11px;
           padding: 11px 16px; font-size: 15px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent);
                   font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .icon { width: 44px; padding: 0; height: 44px; font-size: 19px; flex: none;
          display: flex; align-items: center; justify-content: center; }
  main { max-width: 720px; margin: 0 auto; padding: 26px 20px 210px; }

  /* List view */
  #list { max-width: 720px; margin: 0 auto; }
  .card { display: flex; align-items: stretch; border: 1px solid var(--line);
          border-radius: 14px; margin-bottom: 12px; background: var(--panel); overflow: hidden; }
  .card-thumb { width: 76px; flex: none; background-size: cover; background-position: center; }
  .card-main { flex: 1; padding: 15px 16px; cursor: pointer; min-width: 0; }
  .card-title { font-size: 17px; font-weight: 650; line-height: 1.3; margin-bottom: 5px;
                overflow-wrap: anywhere; }
  .card-meta { font-size: 13px; color: var(--muted); }
  .card .del { border: none; background: none; color: var(--muted); font-size: 24px;
               width: 46px; flex: none; }
  #listStatus { color: var(--muted); text-align: center; padding: 44px 20px; font-size: 15px; }
  #listStatus.err { color: #d0402a; }

  /* Reader view */
  #hero { width: 100%; height: 160px; border-radius: 14px; margin: 4px 0 20px;
          background-size: cover; background-position: center;
          box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  #back { font-size: 28px; line-height: 1; }
  #title { font-family: -apple-system, system-ui, sans-serif; font-size: 27px;
           font-weight: 800; line-height: 1.22; margin: 0 0 22px; letter-spacing: -.01em; }
  #article { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; line-height: 1.78; }
  #article p { margin: 0 0 1.15em; }
  /* Rich reading structure */
  #article .a-h2 { font-size: 25px; line-height: 1.25; font-weight: 700; margin: 1.5em 0 .5em; letter-spacing: -.01em; }
  #article .a-h3 { font-size: 21px; line-height: 1.3; font-weight: 700; margin: 1.35em 0 .45em; }
  #article .a-bq { margin: 1.2em 0; padding: .1em 0 .1em 1.1em; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic; }
  #article .a-pre { font-family: ui-monospace, Menlo, monospace; font-size: 15px; line-height: 1.6; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; white-space: pre-wrap; }
  #article .a-list { margin: 0 0 1.15em; padding-left: 1.4em; }
  #article ul.a-list { list-style: disc; }
  #article ol.a-list { list-style: decimal; }
  #article .a-li { margin: 0 0 .4em; display: list-item; }
  #article .a-fig { margin: 1.6em 0; text-align: center; }
  #article .a-fig img { max-width: 100%; height: auto; border-radius: 12px; display: block; margin: 0 auto; }
  #article .a-fig figcaption { font-family: -apple-system, system-ui, sans-serif; font-size: 13.5px; color: var(--muted); margin-top: .55em; }
  #article .i-b { font-weight: 700; }
  #article .i-i { font-style: italic; }
  #article .i-code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: var(--panel); padding: .05em .3em; border-radius: 4px; }
  #article .i-a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .w { border-radius: 5px; cursor: pointer; transition: background .08s; }
  .w.active, .w.flash { background: var(--hl); color: var(--hl-ink);
              box-shadow: 0 0 0 3px var(--hl); }

  /* Compass: appears when the narrated word is scrolled out of view */
  .compass { position: fixed; right: 16px; z-index: 15;
             bottom: calc(168px + env(safe-area-inset-bottom));
             width: 46px; height: 46px; border-radius: 50%; border: none;
             background: var(--accent); color: #fff; font-size: 20px; cursor: pointer;
             box-shadow: 0 4px 14px rgba(0,0,0,.28); display: none;
             align-items: center; justify-content: center; }
  .compass.show { display: flex; }
  #status { color: var(--muted); font-size: 15px; padding: 40px 0; text-align: center; }
  #status.err { color: #d0402a; }

  .player { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
            border-top: 1px solid var(--line); padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom)); display: none;
            box-shadow: 0 -6px 22px rgba(0,0,0,.07); }
  .player.on { display: block; }
  .pwrap { max-width: 780px; margin: 0 auto; }
  #seek { width: 100%; accent-color: var(--accent); height: 24px; display: block; }
  .times { display: flex; justify-content: space-between; margin: 0 2px 4px;
           font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .transport { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .bigplay { width: 62px; height: 62px; border-radius: 50%; background: var(--accent);
             border: none; color: #fff; padding: 0;
             display: flex; align-items: center; justify-content: center; }
  .bigplay svg { width: 30px; height: 30px; }
  .tbtn { width: 46px; height: 46px; border: none; background: none; color: var(--ink);
          padding: 0; display: flex; align-items: center; justify-content: center; }
  .tbtn svg { width: 27px; height: 27px; }
  .tbtn:disabled { opacity: .32; }
  #speedChip { justify-self: start; background: var(--chip); border-color: transparent;
               padding: 8px 12px; font-size: 14px; font-weight: 600;
               font-variant-numeric: tabular-nums; }
  #note { text-align: center; color: var(--muted); font-size: 12px; min-height: 15px;
          margin-top: 6px; }

  /* Bottom sheets */
  .sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20;
             opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheetbg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
           background: var(--sheet); border-radius: 20px 20px 0 0;
           padding: 8px 20px max(20px, env(safe-area-inset-bottom));
           transform: translateY(110%); transition: transform .25s ease;
           box-shadow: 0 -10px 40px rgba(0,0,0,.2); max-width: 520px; margin: 0 auto; }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line);
          margin: 8px auto 16px; }
  .field { margin: 0 0 20px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--muted);
                 text-transform: uppercase; letter-spacing: .04em; margin-bottom: 9px; }
  #voice { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 12px;
           background: var(--bg); color: var(--ink); font-size: 16px; }
  .speeds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .speeds button { font-variant-numeric: tabular-nums; padding: 13px 0; font-size: 15px; }
  .speeds button.sel { background: var(--accent); color: #fff; border-color: var(--accent);
                       font-weight: 700; }
  .add-err { color: #d0402a; font-size: 14px; min-height: 18px; margin: 2px 0 10px; }
  #addSubmit, #sheetDone { width: 100%; margin-top: 4px; padding: 14px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between;
                gap: 12px; font-size: 16px; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: var(--line); border-radius: 999px;
                   transition: background .2s; cursor: pointer; }
  .switch .track::before { content: ''; position: absolute; left: 3px; top: 3px;
                           width: 22px; height: 22px; background: #fff; border-radius: 50%;
                           transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(20px); }

  /* User highlights in the article */
  .hl { background: var(--uhl); border-radius: 3px; cursor: pointer; }
  .hl.has-note { box-shadow: inset 0 -2px 0 var(--accent); }

  /* Floating selection toolbar */
  .selbar { position: fixed; z-index: 30; display: none; gap: 2px;
            background: #202024; border-radius: 12px; padding: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .selbar.show { display: flex; }
  .selbar button { background: none; border: none; color: #fff; font-size: 14px;
                   font-weight: 600; padding: 9px 14px; border-radius: 9px; white-space: nowrap; }
  .selbar button:active { background: rgba(255,255,255,.16); }

  /* Highlight note sheet */
  .hl-quote { font-family: Georgia, serif; font-size: 16px; line-height: 1.5;
              background: var(--chip); border-radius: 12px; padding: 12px 14px;
              margin: 4px 0 16px; max-height: 30vh; overflow: auto; }
  #hlNote { width: 100%; min-height: 88px; padding: 12px; border: 1px solid var(--line);
            border-radius: 12px; background: var(--bg); color: var(--ink);
            font-family: inherit; font-size: 16px; resize: vertical; }
  .hl-actions { display: flex; gap: 10px; margin-top: 6px; }
  .hl-actions #hlSave { flex: 1; padding: 14px; }
  .hl-actions #hlDelete { padding: 14px 18px; color: #d0402a; }

  /* Highlights screen */
  #hlList { max-width: 720px; margin: 0 auto; }
  .hl-group { margin-bottom: 24px; }
  .hl-group-title { font-size: 13px; font-weight: 700; color: var(--muted);
                    text-transform: uppercase; letter-spacing: .03em; margin-bottom: 12px;
                    overflow-wrap: anywhere; }
  .hl-item { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px;
             margin-bottom: 16px; cursor: pointer; }
  .hl-item-quote { font-family: Georgia, serif; font-size: 17px; line-height: 1.5; }
  .hl-item-note { font-size: 14px; color: var(--muted); margin-top: 6px; }
  #hlListStatus { color: var(--muted); text-align: center; padding: 44px 20px; font-size: 15px; }
  #hlListStatus.err { color: #d0402a; }
  /* Books + chapters */
  #bookList, #chList { max-width: 720px; margin: 0 auto; }
  .ch-item { display: flex; align-items: baseline; gap: 14px; padding: 15px 4px;
             border-bottom: 1px solid var(--line); cursor: pointer; }
  .ch-num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px;
            min-width: 22px; text-align: right; flex: none; }
  .ch-title { font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
  .ch-item.current .ch-title { color: var(--accent); font-weight: 650; }
  .ch-search { margin: 0 0 12px; }
  #chSearch { width: 100%; padding: 11px 14px; font-size: 16px; border: 1px solid var(--line);
              border-radius: 12px; background: var(--panel); color: inherit; }
  #chSearch:focus { outline: none; border-color: var(--accent); }
  .sr-item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
             margin-bottom: 8px; cursor: pointer; background: var(--panel); }
  .sr-item:hover { border-color: var(--accent); }
  .sr-ch { font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  .sr-snip { font-size: 14.5px; line-height: 1.45; }
  .sr-snip b { background: var(--uhl); border-radius: 3px; font-weight: 600; }
  .sr-empty { color: var(--muted); text-align: center; padding: 28px 20px; font-size: 15px; }
  #bookStatus, #chStatus { color: var(--muted); text-align: center; padding: 44px 20px; font-size: 15px; }
  #bookStatus.err, #chStatus.err { color: #d0402a; }
  /* Welcome splash */
  #splash { position: fixed; inset: 0; z-index: 100; background: var(--brand);
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            transition: opacity .5s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }
  #splashImg { max-width: 80%; max-height: 80%; }
  #splashFallback { display: none; flex-direction: column; align-items: center; gap: 46px; }
  .splash-word { color: #fff; font-weight: 900; font-size: clamp(54px, 17vw, 116px);
                 letter-spacing: 3px; line-height: 1; }
  .splash-wave { display: flex; align-items: center; gap: 5px; height: 56px; }
  .splash-wave i { width: 5px; height: 12px; background: #fff; border-radius: 3px;
                   animation: swave 1s ease-in-out infinite; }
  @keyframes swave { 0%,100% { height: 12px; } 50% { height: 46px; } }
  .hidden { display: none; }

  /* Brief confirmation toast (used by the share-to-Tolkien flow). */
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    z-index: 120; background: var(--brand); color: #fff; padding: 12px 18px;
    border-radius: 999px; font-size: 15px; max-width: 88%; box-shadow: 0 8px 24px rgba(0,0,0,.22);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div id="toast"></div>

<!-- Sign-in gate: shown until a Google/Supabase session exists. -->
<div id="authView" style="display:none; position:fixed; inset:0; z-index:90;
     background:var(--brand); color:#fff; flex-direction:column; align-items:center;
     justify-content:center; gap:26px; padding:32px; text-align:center;">
  <img src="/static/tolkien-icon-192.png" alt="" style="width:96px; height:96px;
       border-radius:22px; box-shadow:0 10px 40px rgba(0,0,0,.35);">
  <div>
    <div style="font-family:Georgia,'Times New Roman',serif; font-size:40px;
         font-weight:800; letter-spacing:.01em;">Tolkien</div>
    <div style="opacity:.82; font-size:16px; margin-top:8px;">Your premium listening library</div>
  </div>
  <button id="googleBtn" style="display:flex; align-items:center; gap:12px; background:#fff;
     color:#1f1f1f; border:none; border-radius:999px; padding:14px 22px; font-size:16px;
     font-weight:600; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.25);">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.2 13.4 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7C43.8 37.6 46.5 31.6 46.5 24.5z"/><path fill="#FBBC05" d="M10.4 28.3c-.5-1.5-.8-3.1-.8-4.8s.3-3.3.8-4.8l-7.8-6.1C1 15.9 0 19.8 0 23.5s1 7.6 2.6 10.9l7.8-6.1z"/><path fill="#34A853" d="M24 47c6.2 0 11.4-2 15.2-5.5l-7.3-5.7c-2 1.4-4.7 2.3-7.9 2.3-6.4 0-11.8-3.9-13.6-9.3l-7.8 6.1C6.5 42.6 14.6 47 24 47z"/></svg>
    Continue with Google
  </button>
</div>

<!-- Welcome splash: uses the brand GIF if present, else a clean animated fallback -->
<div id="splash">
  <img id="splashImg" src="/static/tolkien-splash.gif" alt="Tolkien"
       onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
  <div id="splashFallback">
    <div class="splash-word">TOLKIEN</div>
    <div class="splash-wave">
      <i style="animation-delay:0s"></i><i style="animation-delay:.08s"></i><i style="animation-delay:.16s"></i>
      <i style="animation-delay:.24s"></i><i style="animation-delay:.32s"></i><i style="animation-delay:.4s"></i>
      <i style="animation-delay:.48s"></i><i style="animation-delay:.4s"></i><i style="animation-delay:.32s"></i>
      <i style="animation-delay:.24s"></i><i style="animation-delay:.16s"></i><i style="animation-delay:.08s"></i>
      <i style="animation-delay:0s"></i>
    </div>
  </div>
</div>

<!-- ===== LIST VIEW ===== -->
<div id="listView">
  <header>
    <div class="bar bar-between">
      <h1 class="app-title">Tolkien</h1>
      <div style="display:flex; gap:8px; align-items:center;">
        <button id="booksBtn" class="icon" aria-label="Books">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h5v16H6a2 2 0 0 0-2 2V5z"/><path d="M20 5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2V5z"/></svg>
        </button>
        <button id="hlScreenBtn" class="icon" aria-label="Highlights">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        </button>
        <button id="acctBtn" class="icon" aria-label="Account">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </button>
        <button id="addBtn" class="primary">+ Add</button>
      </div>
    </div>
  </header>
  <main>
    <div id="list"></div>
    <div id="listStatus"></div>
  </main>
</div>

<!-- ===== HIGHLIGHTS VIEW ===== -->
<div id="highlightsView" class="hidden">
  <header>
    <div class="bar">
      <button id="hlBack" class="icon" aria-label="Back to list">‹</button>
      <h1 class="app-title" style="margin-left:4px;">Highlights</h1>
    </div>
  </header>
  <main>
    <div id="hlList"></div>
    <div id="hlListStatus"></div>
  </main>
</div>

<!-- ===== BOOKS VIEW ===== -->
<div id="booksView" class="hidden">
  <header>
    <div class="bar bar-between">
      <div style="display:flex; align-items:center;">
        <button id="booksBack" class="icon" aria-label="Back to list">‹</button>
        <h1 class="app-title" style="margin-left:4px;">Books</h1>
      </div>
      <button id="uploadBtn" class="primary">+ Upload</button>
    </div>
  </header>
  <main>
    <div id="bookList"></div>
    <div id="bookStatus"></div>
  </main>
</div>

<!-- ===== CHAPTERS (TOC) VIEW ===== -->
<div id="chaptersView" class="hidden">
  <header>
    <div class="bar">
      <button id="chBack" class="icon" aria-label="Back to books">‹</button>
      <h1 class="app-title" id="chBookTitle" style="margin-left:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">Book</h1>
    </div>
  </header>
  <main>
    <div class="ch-search"><input id="chSearch" type="search" placeholder="Search this book…" autocomplete="off"></div>
    <div id="chSearchResults"></div>
    <div id="chList"></div>
    <div id="chStatus"></div>
  </main>
</div>

<input id="epubInput" type="file" accept=".epub,application/epub+zip" style="display:none">

<!-- ===== READER VIEW ===== -->
<div id="readerView" class="hidden">
  <header>
    <div class="bar">
      <button id="back" class="icon" aria-label="Back to list">‹</button>
      <div class="spacer"></div>

<script>
const $ = s => document.querySelector(s);
const audio = $('#audio');

// --- PWA background keepalive ---
// In an installed (standalone) iOS PWA, iOS suspends the app's JS once ALL audio
// stops, so a lock-screen "play" after a pause never reaches our MediaSession
// handler. Keep an inaudible looping clip playing THROUGH pauses so the audio
// session — and thus our handlers — stay alive and resume works handsfree. Gated
// to standalone (Safari already works); a ~20-min idle cap bounds battery use.
const KeepAlive = (() => {
  const on = () => window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  const SILENCE = 'data:audio/wav;base64,UklGRtQEAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YbAEAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=';
  let el = null, idleTimer = null;
  function ensure() {
    if (el) return el;
    el = document.createElement('audio');
    el.loop = true; el.volume = 0.02; el.setAttribute('playsinline', '');
    el.src = SILENCE;
    document.body.appendChild(el);

  }
  return {
    // start/keep the silent loop (call inside a user gesture)
    start() { if (!on()) return; clearTimeout(idleTimer); ensure().play().catch(() => {}); },
    // narration paused: keep the session alive, but bound battery with an idle cap
    holdWhilePaused() { if (!on()) return; clearTimeout(idleTimer); idleTimer = setTimeout(() => this.stop(), 20 * 60 * 1000); },
    stop() { clearTimeout(idleTimer); if (el) { try { el.pause(); } catch (e) {} } },
  };
})();

// --- Auth state + fetch wrapper ---
// Every same-origin /api/* request carries the signed-in user's bearer token.
// Wrapping fetch once covers runJob, apiJSON, and the raw fetch call sites
// (incl. the multipart EPUB upload — only a header is added, body untouched).
let SB = null;            // Supabase client
let USER = null;          // { id, email }
let AUTH_TOKEN = null;    // Supabase access token
const _origFetch = window.fetch.bind(window);
window.fetch = (input, init = {}) => {

    if (AUTH_TOKEN && url.startsWith('/api/')) {
      init = { ...init };
      const h = new Headers(init.headers || undefined);
      h.set('Authorization', 'Bearer ' + AUTH_TOKEN);
      init.headers = h;
    }

};

let BLOCKS = [];          // rich structure: [{t,s,e,list?} | {t:'img',src,alt,caption}]

// default 1.25x, but remember the user's last-used speed across sessions

const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = s => escapeHtml(s).replace(/\n{2,}/g, '</p><p>').replace(/\n/g, ' ');

// --- Generative placeholders ---
// A deterministic muted/editorial contour-line image per document, seeded by its
// id — used as the fallback cover (card + reader hero + lock-screen artwork) when
// a document has no real image. Drawn on canvas, memoized by seed@size.
const Placeholder = (() => {
  // Curated muted / editorial grounds {a: ground, line: line-color}.
  const PALETTES = [
    { a: '#2b2f3a', line: '#9aa6bd' }, // slate
    { a: '#312a38', line: '#b49cc0' }, // plum
    { a: '#2a322f', line: '#93b09e' }, // moss
    { a: '#38302a', line: '#c8a684' }, // clay
    { a: '#2a2f3d', line: '#8ea0c4' }, // dusk-blue
    { a: '#332b2c', line: '#c096a0' }, // ash-rose
    { a: '#2f4442', line: '#86a39b' }, // teal-slate
    { a: '#393b52', line: '#9195b4' }, // indigo-ash
    { a: '#46402f', line: '#a89774' }, // ochre
    { a: '#383e44', line: '#93a0a8' }, // storm
  ];
  function hashStr(s) {                       // xmur3-style string -> uint32
    s = String(s);
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function mulberry32(a) {                     // seeded RNG
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let _grain = null;
  function grainTile() {                       // one grayscale-noise tile, reused
    if (_grain) return _grain;
    const n = 128, c = document.createElement('canvas');
    c.width = c.height = n;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(n, n);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return (_grain = c);
  }
  const cache = new Map();
  function art(seed, w, h) {
    const key = seed + '@' + w + 'x' + h;
    if (cache.has(key)) return cache.get(key);
    const hash = hashStr(seed);
    const rnd = mulberry32(hash);
    const pal = PALETTES[hash % PALETTES.length];
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = pal.a; ctx.fillRect(0, 0, w, h);
    // generative topographic contour lines, seeded
    ctx.strokeStyle = pal.line;
    ctx.lineWidth = Math.max(1, Math.round(Math.min(w, h) / 150));
    const L = Math.max(14, Math.round(h / 9)), step = Math.max(3, w / 130);
    for (let i = 0; i < L; i++) {
      ctx.globalAlpha = 0.14 + 0.5 * (i / L);
      ctx.beginPath();
      const base = h * 0.05 + i * (h * 0.92 / L);
      const amp = (4 + rnd() * 14) * (h / 220), ph = rnd() * 6.283, fr = 1 + rnd() * 2.4;
      const wob = Math.sin(0.4 + i * 0.42);
      for (let x = 0; x <= w; x += step) {
        const y = base + Math.sin(x / w * Math.PI * fr + ph) * amp * wob;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // faint grain for texture
    const tile = grainTile();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.05;
    for (let y = 0; y < h; y += tile.height)
      for (let x = 0; x < w; x += tile.width) ctx.drawImage(tile, x, y);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    const url = c.toDataURL('image/png');
    cache.set(key, url);
    return url;
  }
  return { art };
})();

// The cover for a card/hero/lock screen: the doc's real image if it has one,
// else the generated contour placeholder seeded by its id.
function coverFor(id, cover, w, h) {
  return cover ? cover : Placeholder.art(id, w, h);
}

// Paint the reader hero banner from the open doc's id (shares the card's look).
function paintHero() {
  const el = $('#hero');
  if (!el || !CUR_ID) return;
  el.style.backgroundImage = `url("${coverFor(CUR_ID, COVER, 1200, 320)}")`;
  el.classList.remove('hidden');
}

// Runs a slow server task via the job API: POST starts it and returns a job id
// instantly, then we poll /api/job/{id} until it's done. This keeps every request
// under ~1s so Cloudflare's edge (which resets slower HTTP/2 requests) never trips.
async function runJob(url, body) {
  const start = await fetch(url, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  const s = await start.json();
  if (!start.ok) throw new Error(s.detail || start.statusText);
  const job = s.job;
  for (let tries = 0; tries < 240; tries++) {   // ~2 min ceiling
    await new Promise(r => setTimeout(r, 500));
    const r = await fetch('/api/job/' + job);
    if (!r.ok) throw new Error('Lost track of the job — try again.');
    const j = await r.json();
    if (j.status === 'done') return j.result;
    if (j.status === 'error') throw new Error(j.error);
  }
  throw new Error('Timed out.');
}

// ============================================================
//  BACKGROUND MOOD MUSIC — generative Web Audio (no files)
// ============================================================
const MoodMusic = (() => {
  // per-mood musical params: root Hz, chord intervals (semitones), filter Hz, level, timbre
  const P = {
    neutral:    { root: 130.81, ivals: [0, 7, 12],      cutoff: 600,  level: 0.0,  wave: 'sine' },
    calm:       { root: 130.81, ivals: [0, 7, 12, 16],  cutoff: 950,  level: 1.0,  wave: 'sine' },
    hopeful:    { root: 146.83, ivals: [0, 4, 7, 11],   cutoff: 1500, level: 1.0,  wave: 'triangle' },
    sad:        { root: 110.00, ivals: [0, 3, 7, 10],   cutoff: 650,  level: 0.95, wave: 'sine' },
    tense:      { root: 123.47, ivals: [0, 1, 6, 7],    cutoff: 850,  level: 0.9,  wave: 'sawtooth' },
    mysterious: { root: 116.54, ivals: [0, 2, 6, 10],   cutoff: 1050, level: 0.85, wave: 'triangle' },
    epic:       { root: 98.00,  ivals: [0, 7, 12, 19],  cutoff: 1250, level: 1.0,  wave: 'sawtooth' },
  };
  let ctx, master, banks, current = 'neutral', running = false, vol = musicVol;

  function reverb() {
    const d = ctx.createDelay(1); d.delayTime.value = 0.3;
    const fb = ctx.createGain(); fb.gain.value = 0.36;
    const wet = ctx.createGain(); wet.gain.value = 0.45;
    d.connect(fb); fb.connect(d); d.connect(wet);
    return { input: d, output: wet };
  }
  function makeBank() {
    const g = ctx.createGain(); g.gain.value = 0;
    const filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 700;
    filter.connect(g);
    const oscs = [];
    for (let i = 0; i < 4; i++) {
      const o = ctx.createOscillator(), og = ctx.createGain();
      og.gain.value = 0; o.connect(og); og.connect(filter); o.start();
      oscs.push({ o, og });
    }
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05;   // slow filter drift = movement
    const lg = ctx.createGain(); lg.gain.value = 180;
    lfo.connect(lg); lg.connect(filter.frequency); lfo.start();
    return { g, filter, oscs };
  }
  function configure(bank, mood) {
    const m = P[mood] || P.neutral, t = ctx.currentTime;
    const freqs = m.ivals.map(s => m.root * Math.pow(2, s / 12));
    bank.filter.frequency.setTargetAtTime(m.cutoff, t, 1.5);
    bank.oscs.forEach((v, i) => {
      v.o.type = m.wave;
      v.o.frequency.setTargetAtTime(freqs[i % freqs.length], t, 1.2);
      v.o.detune.setTargetAtTime((i - 1.5) * 4, t, 1);        // gentle chorus
      v.og.gain.setTargetAtTime(m.level * 0.2, t, 2);
    });
  }
  function ensure() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0;
    const rev = reverb();
    banks = [makeBank(), makeBank()];
    banks.forEach(b => { b.g.connect(master); b.g.connect(rev.input); });
    rev.output.connect(master);
    master.connect(ctx.destination);
    configure(banks[0], current); banks[0].g.gain.value = 1;
  }
  return {
    start() {
      ensure();
      if (ctx.state === 'suspended') ctx.resume();
      running = true;
      master.gain.setTargetAtTime(vol, ctx.currentTime, 1.2);
    },
    stop() {
      running = false;
      if (ctx) master.gain.setTargetAtTime(0, ctx.currentTime, 0.7);
    },
    setVolume(v) {
      vol = v;
      if (ctx && running) master.gain.setTargetAtTime(v, ctx.currentTime, 0.3);
    },
    setMood(mood) {                                          // crossfade banks over ~3s
      if (!ctx || !running || !P[mood] || mood === current) return;
      current = mood;
      const act = banks[0].g.gain.value >= banks[1].g.gain.value ? 0 : 1;
      const idle = banks[act ? 0 : 1], t = ctx.currentTime;
      configure(idle, mood);
      idle.g.gain.setTargetAtTime(1, t, 1.6);
      banks[act].g.gain.setTargetAtTime(0, t, 1.6);
    },
  };
})();

// Split the open doc into paragraph char-ranges, look up the mood of a position.
function buildParagraphs() {
  // paragraphs are newline-delimited (articles use \n, books use \n\n)
  PARA_RANGES = []; PARA_MOODS = []; lastParaIdx = -1;
  const re = /\n+/g; let last = 0, m;
  while ((m = re.exec(TEXT))) {
    if (m.index > last) PARA_RANGES.push({ start: last, end: m.index });
    last = m.index + m[0].length;
  }
  if (last < TEXT.length) PARA_RANGES.push({ start: last, end: TEXT.length });
}
function paragraphIndexForChar(ch) {
  let lo = 0, hi = PARA_RANGES.length - 1, ans = 0;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (PARA_RANGES[mid].start <= ch) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}
async function classifyMoods() {
  if (!musicOn || !TEXT || !PARA_RANGES.length) return;
  const snippets = PARA_RANGES.map(r => TEXT.slice(r.start, r.end).slice(0, 300));
  const mine = genId;
  try {
    const res = await runJob('/api/moods', { doc_id: CUR_ID, doc_type: CUR_TYPE, paragraphs: snippets });
    if (mine === genId && res.labels && res.labels.length === PARA_RANGES.length) PARA_MOODS = res.labels;
  } catch (e) { /* leave the score neutral */ }
}
function updateMood() {                                       // called as narration advances
  if (!musicOn || !running() || !PARA_MOODS.length || active < 0) return;
  const marks = window._allMarks || [];
  const ch = marks[active] ? marks[active].start : 0;
  const pi = paragraphIndexForChar(ch);
  if (pi !== lastParaIdx) { lastParaIdx = pi; MoodMusic.setMood(PARA_MOODS[pi] || 'neutral'); }
}
function running() { return !audio.paused; }

// --- View switching ---

  $('#readerView').classList.toggle('hidden', v !== 'reader');
  $('#highlightsView').classList.toggle('hidden', v !== 'highlights');
  $('#booksView').classList.toggle('hidden', v !== 'books');
  $('#chaptersView').classList.toggle('hidden', v !== 'chapters');
}

// Direct JSON request for the fast highlight endpoints (Supabase ops are < 1s).
async function apiJSON(method, url, body) {
  const opt = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  const txt = await r.text();
  const d = txt ? JSON.parse(txt) : null;
  if (!r.ok) throw new Error((d && d.detail) || r.statusText);
  return d;
}

// --- Whole-article progress + ETA (word-based, scales with speed) ---
function etaTotalSec() { return totalWords ? (totalWords / (WPM_1X * RATE)) * 60 : 0; }
function articleFrac() {           // fraction of the whole article read so far
  const c = CHUNKS[playing];
  if (!c || !audio.duration || !TEXT) return 0;
  const within = Math.min(1, audio.currentTime / audio.duration);
  return Math.min(1, (c.start + within * (c.end - c.start)) / TEXT.length);
}
function updateTimeDisplay(frac) {
  const total = etaTotalSec();
  const cur = frac * total;
  $('#time-cur').textContent = fmt(cur);
  $('#time-rem').textContent = '-' + fmt(Math.max(0, total - cur));
}

//  READING LIST
// ============================================================
async function loadList() {
  $('#listStatus').className = '';
  $('#listStatus').textContent = 'Loading…';
  try {
    const res = await fetch('/api/articles');
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    renderList(await res.json());
  } catch (e) {
    $('#list').innerHTML = '';
    $('#listStatus').className = 'err';
    $('#listStatus').textContent = 'Error: ' + e.message;
  }
}

function cardHtml(a) {
  const date = a.added_at
    ? new Date(a.added_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  const p = loadProgress(a.id);
  const read = p > 0.01 && p < 0.99 ? `${Math.round(p * 100)}% read` : '';
  const meta = [a.domain, date, a.est_minutes ? `~${a.est_minutes} min` : '', read]
    .filter(Boolean).join(' · ');
  return `<div class="card" data-id="${a.id}">
    <div class="card-thumb" style="background-image:url('${coverFor(a.id, a.cover, 76, 76)}')"></div>
    <div class="card-main">
      <div class="card-title">${escapeHtml(a.title || a.url)}</div>
      <div class="card-meta">${escapeHtml(meta)}</div>
    </div>
    <button class="del" aria-label="Delete">×</button>
  </div>`;
}

function renderList(items) {
  if (!items.length) {
    $('#list').innerHTML = '';
    $('#listStatus').className = '';
    $('#listStatus').textContent = 'No saved articles yet. Tap “+ Add article” to save one.';
    return;
  }
  $('#listStatus').textContent = '';
  $('#list').innerHTML = items.map(cardHtml).join('');
  $('#list').querySelectorAll('.card').forEach(el => {
    const item = items.find(x => x.id === el.dataset.id);
    el.querySelector('.card-main').onclick = () => { CUR_BACK = 'list'; openArticle(item); };
    el.querySelector('.del').onclick = () => deleteArticle(el.dataset.id, el);
  });
}

async function deleteArticle(id, el) {
  el.style.opacity = .4;
  try {
    const r = await fetch('/api/articles/' + id, { method: 'DELETE' });
    if (!r.ok) throw new Error((await r.json()).detail || 'Delete failed');
    el.remove();
    if (!$('#list').children.length) renderList([]);
  } catch (e) {
    el.style.opacity = 1;
    alert('Could not delete: ' + e.message);
  }
}

// ============================================================
//  ARTICLE READER  (unchanged playback engine)
// ============================================================
// Every text run becomes a span carrying data-s (its char offset in TEXT), so a
// text selection maps cleanly to character offsets. Word spans (.w) keep data-i
// for narration highlight + click-to-seek; any run inside a saved highlight range
// gets .hl + data-hl. Paragraph breaks (\n\n) split <p>s between spans.
function hlIdAt(pos) {
  for (const h of HIGHLIGHTS) if (pos >= h.start && pos < h.end) return h.id;
  return null;
}
// Text now derives from rich HTML, so stored offsets may drift; re-anchor each
// highlight to its saved quote (fall back to stored offsets if not found).
function reanchorHighlights() {
  if (!TEXT) return;
  for (const h of HIGHLIGHTS) {
    if (!h.quote || TEXT.slice(h.start, h.end) === h.quote) continue;
    const i = TEXT.indexOf(h.quote);
    if (i >= 0) { h.start = i; h.end = i + h.quote.length; }
  }
}
const _INLINE_CLS = { b: 'i-b', i: 'i-i', code: 'i-code', a: 'i-a' };
function inlineAt(pos) {                       // inline styling active at a char offset
  let cls = '', href = null;
  for (const it of INLINES) {
    if (pos >= it.s && pos < it.e) {
      cls += ' ' + (_INLINE_CLS[it.k] || '');
      if (it.k === 'a' && it.href && !href) href = it.href;
    }
  }
  return { cls, href };
}
function figureHtml(b) {
  const cap = b.caption ? `<figcaption>${escapeHtml(b.caption)}</figcaption>` : '';
  return `<figure class="a-fig"><img loading="lazy" src="${escapeHtml(b.src)}" alt="${escapeHtml(b.alt || '')}">${cap}</figure>`;
}
// Blocks fallback for pasted/legacy docs with no structure: split TEXT on blank lines.
function synthBlocks() {
  const out = []; let last = 0, m; const re = /\n{2,}/g;
  while ((m = re.exec(TEXT))) { if (m.index > last) out.push({ t: 'p', s: last, e: m.index }); last = m.index + m[0].length; }
  if (last < TEXT.length) out.push({ t: 'p', s: last, e: TEXT.length });
  return out;
}
function renderArticle() {
  const marks = [];
  CHUNKS.forEach(c => (c.marks || []).forEach(m => marks.push(m)));
  marks.sort((a, b) => a.start - b.start);
  marks.forEach((m, i) => m._span = i);
  window._allMarks = marks;

  const leaf = (s, e, extraCls, dataI) => {   // one data-s span (word or gap), rich-styled
    const hid = hlIdAt(s);
    const inl = inlineAt(s);
    const cls = extraCls + inl.cls + (hid ? ' hl' : '') + (hid && hlNote(hid) ? ' has-note' : '');
    const di = dataI != null ? ` data-i="${dataI}"` : '';
    const dh = hid ? ` data-hl="${hid}"` : '';
    const ha = inl.href ? ` data-href="${escapeHtml(inl.href)}"` : '';
    return `<span class="${cls}" data-s="${s}"${di}${dh}${ha}>${escapeHtml(TEXT.slice(s, e)).replace(/\n/g, ' ')}</span>`;
  };
  let mi = 0;
  const renderRange = (rs, re) => {            // emit word/gap spans covering [rs,re)
    let out = '', cur = rs;
    while (mi < marks.length && marks[mi].start < rs) mi++;
    while (mi < marks.length && marks[mi].start < re) {
      const m = marks[mi];
      if (m.start > cur) out += leaf(cur, m.start, 'g');
      out += leaf(m.start, Math.min(m.end, re), 'w', m._span);
      cur = m.end; mi++;
    }
    if (cur < re) out += leaf(cur, re, 'g');
    return out;
  };

  const blocks = BLOCKS.length ? BLOCKS : synthBlocks();
  let html = '', listOpen = null;
  const closeList = () => { if (listOpen) { html += `</${listOpen}>`; listOpen = null; } };
  for (const b of blocks) {
    if (b.t === 'img') { closeList(); html += figureHtml(b); continue; }
    if (b.t === 'li') {
      const kind = b.list === 'ol' ? 'ol' : 'ul';
      if (listOpen && listOpen !== kind) closeList();
      if (!listOpen) { html += `<${kind} class="a-list">`; listOpen = kind; }
      html += `<li class="a-li">${renderRange(b.s, b.e)}</li>`;
      continue;
    }
    closeList();
    const el = (b.t === 'h2' || b.t === 'h3') ? b.t : (b.t === 'blockquote' ? 'blockquote' : (b.t === 'pre' ? 'pre' : 'p'));
    const cls = { h2: 'a-h2', h3: 'a-h3', blockquote: 'a-bq', pre: 'a-pre' }[b.t] || 'a-p';
    html += `<${el} class="${cls}">${renderRange(b.s, b.e)}</${el}>`;
  }
  closeList();
  $('#article').innerHTML = html || '<p class="a-p"></p>';
  spans = Array.from(document.querySelectorAll('.w'));
}
function hlNote(id) { const h = HIGHLIGHTS.find(x => String(x.id) === String(id)); return h && h.note; }

function fmt(t) {
  if (!isFinite(t)) t = 0;
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}

// --- Synthesis (dedup + prefetch) ---
async function ensureChunk(i) {
  const c = CHUNKS[i];
  if (!c || c.audioUrl) return c;
  if (c._promise) return c._promise;
  const mine = genId;
  c._promise = (async () => {
    const data = await runJob('/api/tts', { text: TEXT.slice(c.start, c.end), voice });
    if (mine !== genId) return c;
    c.audioUrl = data.audio_url;
    c.marks = data.marks.map(m => ({ start: m.start + c.start, end: m.end + c.start, time: m.time }));
    renderArticle();
    return c;
  })();
  return c._promise;
}
// Keep a lookahead of 2 chunks warming up so the next part is ready in time.
function prefetch(i) { for (let j = i; j <= i + 2; j++) ensureChunk(j).catch(() => {}); }

function bindChunk(c) {
  markIndex = (c.marks || []).map(m => ({ time: m.time, span: m._span }))
                             .sort((a, b) => a.time - b.time);
}

// Status line under the player: "Part 2 of 44 · <message>".
function updateNote(msg) {
  const total = CHUNKS.length;
  const part = total > 1 && playing >= 0 ? `Part ${playing + 1} of ${total}` : '';
  $('#note').textContent = [part, msg].filter(Boolean).join(' · ');
  updateTransport();
}

// Initial play / seek target (runs inside a user gesture, so await+play is fine).
async function playFrom(i, seekTime = 0) {
  if (i < 0 || i >= CHUNKS.length) return;
  const mine = genId;
  _wantPlay = true;
  KeepAlive.start();      // runs inside the play gesture, so iOS allows it
  playing = i;
  updateNote('Loading audio…');
  prefetch(i);
  let c;
  try { c = await ensureChunk(i); }
  catch (e) { updateNote('Error: ' + e.message); return; }
  if (mine !== genId || playing !== i) return;
  bindChunk(c);
  audio.src = c.audioUrl;
  audio.playbackRate = RATE;
  try { await audio.play(); } catch (e) { updateNote('Tap ▶ to play'); }
  if (seekTime) audio.currentTime = seekTime;
  updateNote('');
  prefetch(i + 1);
}

// Auto-advance. Runs inside the media 'ended' event: when the next chunk is
// already prefetched we switch src + play() SYNCHRONOUSLY, which iOS allows
// (an async gap here would get the play() blocked -> stuck on part 1).
audio.addEventListener('ended', () => {
  const next = playing + 1;
  if (next >= CHUNKS.length) {
    clearActive(); clearProgress(CUR_ID);
    // in a book, flow straight into the next chapter
    if (CUR_TYPE === 'chapter' && CHAPTERS && CUR_CH_IDX + 1 < CHAPTERS.length) {
      openChapter(CHAPTERS[CUR_CH_IDX + 1], CHAPTERS, CUR_CH_IDX + 1);
    } else {
      updateNote('Finished');
    }
    return;
  }
  playing = next;
  const c = CHUNKS[next];
  if (c && c.audioUrl) {
    bindChunk(c);
    audio.src = c.audioUrl;
    audio.playbackRate = RATE;
    audio.play().catch(() => updateNote('Tap ▶ to continue'));
    updateNote('');
    prefetch(next + 1);
  } else {
    updateNote('Loading part ' + (next + 1) + '…');
    ensureChunk(next).then(cc => {
      if (playing !== next) return;
      bindChunk(cc);
      audio.src = cc.audioUrl;
      audio.playbackRate = RATE;
      audio.play().catch(() => updateNote('Tap ▶ to continue'));
      updateNote('');
      prefetch(next + 1);
    }).catch(e => updateNote('Error: ' + e.message));
  }
});

// Open a saved article: switch to reader, extract text, render, play.
// `seekChar` (optional) jumps to a spot — used when opening from a highlight.
async function openArticle(item, seekChar) {
  showView('reader');
  window.scrollTo(0, 0);
  genId++;
  CUR_TYPE = 'article';
  CUR_ID = item.id; CUR_URL = item.url; CUR_TITLE = item.title;
  MediaControls.setMeta();   // now-playing card = article title
  $('#contents').classList.add('hidden');   // articles have no chapter list
  HIGHLIGHTS = [];
  $('#status').className = '';
  $('#status').textContent = 'Extracting article…';
  $('#title').classList.add('hidden');
  $('#article').innerHTML = '';
  $('#player').classList.remove('on');
  $('#seek').value = 0;
  clearActive();
  try {
    const [data, hls] = await Promise.all([
      runJob('/api/extract', { url: item.url }),
      apiJSON('GET', '/api/highlights?article_id=' + encodeURIComponent(item.id)).catch(() => [])
    ]);
    TEXT = data.text;
    BLOCKS = data.blocks || []; INLINES = data.inlines || []; IMAGES = data.images || [];
    COVER = data.cover || null;
    totalWords = (TEXT.match(/\S+/g) || []).length;
    buildParagraphs(); classifyMoods();   // paragraph moods for background music
    CHUNKS = data.chunks.map(c => ({ ...c, marks: null, audioUrl: null }));
    HIGHLIGHTS = hls || []; reanchorHighlights();
    $('#title').textContent = item.title || data.title;
    $('#title').classList.remove('hidden');
    paintHero();
    $('#status').textContent = '';
    renderArticle();
    $('#player').classList.add('on');
    updateTimeDisplay(0);
    if (seekChar != null) { seekToChar(seekChar); scrollToChar(seekChar); }
    else {
      const resume = loadProgress(item.id);   // continue where we left off last time
      if (resume > 0.01 && resume < 0.99) seekToChar(resume * TEXT.length);
      else playFrom(0);
    }
  } catch (e) {
    $('#status').className = 'err';
    $('#status').textContent = 'Error: ' + e.message;
  }
}

// --- Highlight sync ---
function clearActive() { if (spans[active]) spans[active].classList.remove('active'); active = -1; }

// --- Reading pointer: free scroll + a compass back to the narrated word ---
function updateCompass() {
  const sp = spans[active];
  const inReader = !$('#readerView').classList.contains('hidden');
  if (!sp || !inReader || playing < 0) { $('#compass').classList.remove('show'); return; }
  const r = sp.getBoundingClientRect();
  if (r.bottom < 72) {                              // narrated word is above the viewport
    $('#compass').textContent = '↑'; $('#compass').classList.add('show');
  } else if (r.top > window.innerHeight - 96) {     // below the viewport (behind the player)
    $('#compass').textContent = '↓'; $('#compass').classList.add('show');
  } else {
    $('#compass').classList.remove('show');
  }
}
let compassRAF = 0;
window.addEventListener('scroll', () => {
  $('#selbar').classList.remove('show');   // selection toolbar shouldn't float while scrolling
  if (compassRAF) return;
  compassRAF = requestAnimationFrame(() => { compassRAF = 0; updateCompass(); });
}, { passive: true });
$('#compass').onclick = () => {
  const sp = spans[active];
  if (!sp) return;
  sp.scrollIntoView({ block: 'center', behavior: 'smooth' });
  sp.classList.add('flash');                        // brief pulse so it's easy to spot
  setTimeout(() => sp.classList.remove('flash'), 1100);
  $('#compass').classList.remove('show');
};
function currentMark(t) {
  let lo = 0, hi = markIndex.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (markIndex[mid].time <= t) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  return ans;
}
audio.addEventListener('timeupdate', () => {
  const mi = currentMark(audio.currentTime);
  const span = mi >= 0 ? markIndex[mi].span : -1;
  if (span !== active) {
    if (spans[active]) spans[active].classList.remove('active');
    if (highlightOn && spans[span]) spans[span].classList.add('active');
    active = span;
    updateCompass();      // no forced scroll — the compass offers to catch up
    updateMood();         // shift the background score to this paragraph's mood
  }
  const frac = articleFrac();
  if (!dragging) {
    $('#seek').value = frac * 1000;      // progress across the whole article
    updateTimeDisplay(frac);
  }
  MediaControls.position();               // feed the lock-screen scrubber
  if (audio.currentTime > 0) _lastT = audio.currentTime;   // last-good pos for recovery
  if (Date.now() - lastSave > 4000) { lastSave = Date.now(); saveProgress(); }
});

function seekToGlobalSpan(spanIdx) {
  const marks = window._allMarks || [];
  const m = marks.find(x => x._span === spanIdx);
  if (!m) return;
  const ci = CHUNKS.findIndex(c => m.start >= c.start && m.start < c.end);
  if (ci < 0) return;
  const local = (CHUNKS[ci].marks || []).find(x => x._span === spanIdx);
  const t = local ? local.time : 0;
  if (ci === playing) { audio.currentTime = t + 0.01; audio.play(); }
  else playFrom(ci, t + 0.01);
}

// ============================================================
//  HIGHLIGHTS & NOTES
// ============================================================
// Tapping a highlight opens its note; tapping a plain word seeks there.
$('#article').addEventListener('click', e => {
  if (window.getSelection && !window.getSelection().isCollapsed) return;  // mid-selection
  const hlEl = e.target.closest('[data-hl]');
  if (hlEl) { openHighlight(hlEl.dataset.hl); return; }
  const w = e.target.closest('.w');
  if (w) seekToGlobalSpan(+w.dataset.i);
});

// Map a selection endpoint (text node + offset) to a character offset in TEXT.
function charOffsetOf(node, offset) {
  const el = node.nodeType === 3 ? node.parentElement : node;
  const span = el && el.closest('[data-s]');
  if (!span) return null;
  return +span.dataset.s + (node.nodeType === 3 ? offset : 0);
}
// Expand a raw [a,b] range to cover the whole words it touches.
function snapToWords(a, b) {
  const marks = window._allMarks || [];
  if (!marks.length) return { start: a, end: b };
  let s = null, e = null;
  for (const m of marks) if (m.end > a) { s = m; break; }
  for (const m of marks) { if (m.start < b) e = m; else break; }
  if (!s || !e || s.start >= e.end) return null;
  return { start: s.start, end: e.end };
}
function currentSelectionRange() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  const art = $('#article');
  if (!art.contains(range.startContainer) || !art.contains(range.endContainer)) return null;
  const a = charOffsetOf(range.startContainer, range.startOffset);
  const b = charOffsetOf(range.endContainer, range.endOffset);
  if (a == null || b == null) return null;
  return snapToWords(Math.min(a, b), Math.max(a, b));
}

// Floating "Highlight / Note" toolbar over the current selection
function updateSelToolbar() {
  const tb = $('#selbar');
  const snapped = currentSelectionRange();
  if (!snapped) { tb.classList.remove('show'); return; }
  tb.dataset.start = snapped.start; tb.dataset.end = snapped.end;

// --- Seek by character position (for the whole-article progress bar + resume) ---
function chunkForChar(ch) { return CHUNKS.findIndex(c => ch >= c.start && ch < c.end); }
function charToTime(c, ch) {         // audio time of the last word starting at/before `ch`
  const marks = c.marks || [];
  let lo = 0, hi = marks.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (marks[mid].start <= ch) { ans = marks[mid].time; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}
async function seekToChar(ch) {
  ch = Math.max(0, Math.min((TEXT.length || 1) - 1, ch));
  const ci = chunkForChar(ch);
  if (ci < 0) return;
  if (ci === playing && audio.duration && CHUNKS[ci].marks) {
    audio.currentTime = charToTime(CHUNKS[ci], ch);
    audio.play().catch(() => {});
  } else {
    await playFrom(ci);
    const c = CHUNKS[ci];
    if (c && c.marks) audio.currentTime = charToTime(c, ch);
  }
}

// --- Lock-screen / AirPods media controls (MediaSession API) ---
// Makes the OS treat narration like a podcast app: a now-playing card on the
// lock screen + Control Center (title / "Tolkien" / pipe artwork), and
// hardware & earbud play-pause-skip routed through the same in-app controls
// (skip = parts). All feature-detected so older browsers are unaffected.
const MediaControls = {
  ok: 'mediaSession' in navigator,
  setMeta() {
    if (!this.ok || !CUR_TITLE) return;
    const album = CUR_TYPE === 'chapter' ? ($('#chBookTitle').textContent || '') : '';
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: CUR_TITLE,
        artist: 'Tolkien',
        album,
        artwork: COVER ? [
          { src: COVER, sizes: '512x512' },
        ] : CUR_ID ? [
          { src: Placeholder.art(CUR_ID, 512, 512), sizes: '512x512', type: 'image/png' },
          { src: Placeholder.art(CUR_ID, 256, 256), sizes: '256x256', type: 'image/png' },
        ] : [
          { src: '/static/tolkien-icon-512.png', sizes: '512x512', type: 'image/png' },
        ],
      });
    } catch (e) {}
  },
  init() {
    if (!this.ok) return;
    const set = (a, fn) => { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) {} };
    set('play', doPlay);
    set('pause', doPause);
    set('previoustrack', prevPart);
    set('nexttrack', nextPart);
  },
  state(s) { if (this.ok) { try { navigator.mediaSession.playbackState = s; } catch (e) {} } },
  position() {
    if (!this.ok || !navigator.mediaSession.setPositionState) return;
    const d = audio.duration;
    if (!isFinite(d) || d <= 0) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: d, position: Math.min(audio.currentTime, d), playbackRate: RATE || 1,
      });
    } catch (e) {}
  },
  clear() {
    if (!this.ok) return;
    try { navigator.mediaSession.metadata = null; } catch (e) {}
    this.state('none');
  },
};

// --- Controls ---
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>';
$('#play').innerHTML = ICON_PLAY;
// Shared play/pause + skip bodies so the in-app buttons, keyboard Space, and the
// lock-screen / AirPods controls all go through one path (MoodMusic never desyncs).
let _wantPlay = false;    // does the user currently intend playback? (drives recovery)
let _recovering = false;
let _recoverTries = 0;    // capped so a truly-down source can't loop forever
// The audio clips live only in the server's memory (and the free tier sleeps), so a
// paused-while-locked resume can hit a stale /audio URL that 404s. Rather than fail
// silently, re-synthesize the current part on demand and resume where we were — this
// is what makes AirPods / lock-screen play work handsfree.
async function recoverPlayback() {
  if (_recovering || playing < 0) return;
  if (_recoverTries >= 3) { updateNote('Tap ▶ to resume'); return; }  // give up, no loop
  _recoverTries++;
  _recovering = true;
  const mine = genId, i = playing;
  const t = (isFinite(audio.currentTime) && audio.currentTime > 0) ? audio.currentTime : _lastT;
  updateNote('Reconnecting…');
  try {
    const c = CHUNKS[i];
    if (c) { c.audioUrl = null; c._promise = null; }   // force a fresh /audio URL
    const fresh = await ensureChunk(i);
    if (mine !== genId || playing !== i) return;
    bindChunk(fresh);
    audio.src = fresh.audioUrl;
    audio.playbackRate = RATE;
    await audio.play();
    if (t) { try { audio.currentTime = t; } catch (e) {} }
    updateNote('');
    MediaControls.setMeta(); MediaControls.position();
  } catch (e) {
    updateNote('Tap ▶ to resume');
  } finally {
    _recovering = false;
  }
}
async function doPlay() {
  _wantPlay = true;
  _recoverTries = 0;        // each explicit play intent gets a fresh set of retries
  KeepAlive.start();        // hold the audio session open (installed PWA)
  try { await audio.play(); }
  catch (e) { await recoverPlayback(); }   // stale source / blocked -> self-heal
}
// Pause narration but DON'T stop the keepalive — that's what keeps iOS from
// suspending the PWA, so the lock-screen/AirPods play handler still fires.
function doPause() { _wantPlay = false; audio.pause(); MoodMusic.stop(); KeepAlive.holdWhilePaused(); }
function prevPart() {   // podcast-style: restart the current part if we're >3s in
  if (playing < 0) return;
  _wantPlay = true;
  if (audio.currentTime > 3 || playing === 0) { audio.currentTime = 0; doPlay(); }
  else playFrom(playing - 1);
}
function nextPart() {
  _wantPlay = true;
  if (playing >= 0 && playing + 1 < CHUNKS.length) playFrom(playing + 1);
}
$('#play').onclick = () => { if (audio.paused) doPlay(); else doPause(); };
audio.addEventListener('play', () => { $('#play').innerHTML = ICON_PAUSE; MediaControls.state('playing'); });
// Catch-all for pauses that bypass doPause() (interruptions, route changes) —
// keep the session held so a lock-screen resume still reaches us.
audio.addEventListener('pause', () => { $('#play').innerHTML = ICON_PLAY; MediaControls.state('paused'); KeepAlive.holdWhilePaused(); });
// 'playing' fires each time audio actually resumes (incl. part/chapter changes) —
// keep the music going across those without dipping.
audio.addEventListener('playing', () => { _recoverTries = 0; if (musicOn) { MoodMusic.start(); updateMood(); } });
// If the source 404s/errors mid-intent (server slept, clip evicted), self-heal.
audio.addEventListener('error', () => { if (_wantPlay) recoverPlayback(); });

$('#prev').onclick = prevPart;
$('#next').onclick = nextPart;
function updateTransport() {
  $('#prev').disabled = playing < 0;
  $('#next').disabled = !(playing >= 0 && playing + 1 < CHUNKS.length);
}
$('#seek').addEventListener('input', () => {
  dragging = true;
  updateTimeDisplay(parseFloat($('#seek').value) / 1000);   // live position preview
});
$('#seek').addEventListener('change', () => {
  const frac = parseFloat($('#seek').value) / 1000;
  dragging = false;
  if (TEXT) seekToChar(frac * TEXT.length);
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)
      && !$('#readerView').classList.contains('hidden')) {
    e.preventDefault(); $('#play').click();
  }
});

// --- Share to Tolkien ---
// A shared article arrives as ?share=<url-or-text> (manifest share_target on
// Android/desktop, or the iOS "Add to Tolkien" Shortcut). Add it silently and
// confirm with a toast. Storage is Supabase, so it syncs to the installed PWA
// even when iOS opens this in Safari rather than the standalone app.
let toastTimer = null;
function toast(msg, ms = 2600) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

// Pull the first http(s) URL out of a share payload (often "Title https://…").
function firstUrl(str) {
  if (!str) return null;
  const m = String(str).match(/https?:\/\/[^\s]+/);
  return m ? m[0] : null;
}

async function handleShare() {
  const p = new URLSearchParams(location.search);
  const url = firstUrl(p.get('share') || p.get('url') || p.get('text'));
  if (!url) return false;
  history.replaceState({}, '', '/');            // don't re-add on refresh
  $('#splash').classList.add('hide');           // skip the splash wait
  toast('Adding…', 0);
  try {
    const row = await addUrl(url);
    toast('Added ✓ ' + ((row && row.title) || 'article'));
    await loadList();
  } catch (e) {
    toast("Couldn't add — try again");
  }
  return true;
}

// --- Auth gate + init ---
$('#acctBtn').onclick = () => openSheetEl($('#sheet'));
$('#googleBtn').onclick = () => {
  if (SB) SB.auth.signInWithOAuth({ provider: 'google',
    options: { redirectTo: location.href.split('#')[0] } });
};
$('#signOut').onclick = async () => {
  closeSheets();
  if (SB) await SB.auth.signOut();
  AUTH_TOKEN = null; USER = null;
  showAuth();
};

let _appStarted = false;
function enterApp() {
  $('#authView').style.display = 'none';
  if (USER) $('#acctEmail').textContent = USER.email || '';
  if (_appStarted) { loadList(); return; }   // refresh on re-entry (e.g. account switch)
  _appStarted = true;
  MediaControls.init();
  showView('list');
  loadList();
  handleShare();
  setTimeout(() => $('#splash').classList.add('hide'), 400);
}
function showAuth() {
  _appStarted = false;
  $('#splash').classList.add('hide');
  showView('list');                          // reset to home behind the gate
  $('#authView').style.display = 'flex';
}

async function boot() {
  let cfg = {};
  try { cfg = await fetch('/api/config').then(r => r.json()); } catch (e) {}
  if (!cfg.supabase_url || !cfg.supabase_anon_key || !window.supabase) {
    enterApp();                              // auth not configured (local/dev): stay open
    return;
  }
  SB = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
  const setSession = s => {
    AUTH_TOKEN = s?.access_token || null;
    USER = s?.user ? { id: s.user.id, email: s.user.email } : null;
  };
  const { data: { session } } = await SB.auth.getSession();
  setSession(session);
  SB.auth.onAuthStateChange((_e, s) => { setSession(s); s ? enterApp() : showAuth(); });
  AUTH_TOKEN ? enterApp() : showAuth();
}
boot();
</script>
