# Render Blueprint — deploy with one click from the connected GitHub repo.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: natural-voice-reader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Reading-list storage. Set the actual values in the Render dashboard
      # (Environment tab) — sync:false keeps the secrets out of the repo.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Paragraph mood classification for background music (Claude Haiku).
      - key: ANTHROPIC_API_KEY
        sync: false
